<style>
:root{
  --bg:#F0F1F4; --surface:#FAFBFD; --surface-2:#E9EBF1;
  --ink:#1A1D26; --muted:#6B6F80; --line:#DCDEE6;
  --accent:#34399B; --accent-soft:#34399B18; --warm:#B0452E; --good:#2F6B4F;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","Consolas","SFMono-Regular",Menlo,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131520; --surface:#1A1D2A; --surface-2:#232736;
    --ink:#E9EAF0; --muted:#9498AC; --line:#2A2E3E;
    --accent:#8F94F0; --accent-soft:#8F94F022; --warm:#E2907A; --good:#6FBF95;
  }
}
:root[data-theme="dark"]{
  --bg:#131520; --surface:#1A1D2A; --surface-2:#232736;
  --ink:#E9EAF0; --muted:#9498AC; --line:#2A2E3E;
  --accent:#8F94F0; --accent-soft:#8F94F022; --warm:#E2907A; --good:#6FBF95;
}

:root{
  --tk-comment:#6B6F80; --tk-keyword:#34399B; --tk-string:#2F6B4F;
  --tk-number:#B0452E;  --tk-function:#7A3E9D; --tk-type:#8A5A00;
  --serie-1:#2a78d6; --serie-2:#eb6834; --serie-3:#1baf7a; --serie-4:#eda100;
  --serie-5:#e87ba4; --serie-6:#008300; --serie-7:#4a3aa7; --serie-8:#e34948;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --tk-comment:#9498AC; --tk-keyword:#8F94F0; --tk-string:#6FBF95;
    --tk-number:#E2907A;  --tk-function:#C99BE8; --tk-type:#E0B45C;
    --serie-1:#3987e5; --serie-2:#d95926; --serie-3:#199e70; --serie-4:#c98500;
    --serie-5:#d55181; --serie-6:#008300; --serie-7:#9085e9; --serie-8:#e66767;
  }
}
:root[data-theme="dark"]{
  --tk-comment:#9498AC; --tk-keyword:#8F94F0; --tk-string:#6FBF95;
  --tk-number:#E2907A;  --tk-function:#C99BE8; --tk-type:#E0B45C;
  --serie-1:#3987e5; --serie-2:#d95926; --serie-3:#199e70; --serie-4:#c98500;
  --serie-5:#d55181; --serie-6:#008300; --serie-7:#9085e9; --serie-8:#e66767;
}

:root{
  --lh-prose:1.6;
  --sp-p:1em;
  --sp-h:1.9em;
  --sp-h2:2.2em;
  --sp-blk:1.2em;
  --sp-math:6px 0 10px;
  --sp-mathfb:14px 16px;
  --sp-diag:12px 14px;
  --sp-li:.28em;
  --art-x:28px;
  --art-pad:34px var(--art-x) 96px;
  --katex-disp:0.35em;
}
body.compact{
  --lh-prose:1.38;
  --sp-p:.4em;
  --sp-h:.85em;
  --sp-h2:1.1em;
  --sp-blk:.45em;

  --sp-math:4px 0;
  --sp-mathfb:5px 10px;
  --sp-diag:6px 8px;
  --sp-li:.08em;
  --art-x:24px;
  --art-pad:16px var(--art-x) 32px;
  --katex-disp:0.1em;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:var(--lh-prose);
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%}
[hidden]{display:none!important}

.app{display:grid; grid-template-columns:264px minmax(0,1fr); height:100vh; height:100dvh}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:fixed; inset:0 auto 0 0; width:280px; z-index:20;
        transform:translateX(-100%); transition:transform .2s}
  aside.open{transform:none}
  .scrim{position:fixed; inset:0; background:#0008; z-index:15}
  .menubtn{display:inline-flex!important}
  #sideExpand,#sideCollapse{display:none!important}
}
@media (min-width:821px){
  :root[data-sidebar="collapsed"] .app{grid-template-columns:52px minmax(0,1fr)}
  :root[data-sidebar="collapsed"] #sideInner{display:none}
  :root[data-sidebar="collapsed"] aside{align-items:center; padding-top:14px}
}

.menubtn{
  display:none; align-items:center; justify-content:center;
  font:inherit; font-size:17px; line-height:1; cursor:pointer;
  width:32px; height:32px; flex:none; margin-right:2px;
  border:1px solid var(--line); border-radius:4px;
  background:transparent; color:var(--ink);
}
.menubtn:hover{border-color:var(--accent); color:var(--accent)}

.dropactions{
  display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
  margin:18px 0 4px;
}
.dropactions .btn{text-align:center}

aside{
  background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; min-height:0;
}
#sideInner{display:flex; flex-direction:column; min-height:0; flex:1 1 auto}
#sideExpand{margin:0 auto}
.brand{padding:16px 16px 12px; border-bottom:1px solid var(--line)}
.brand-row{display:flex; align-items:flex-start; justify-content:space-between; gap:8px}
.brand h1{
  font-family:var(--serif); font-size:17px; font-weight:600; margin:0;
  letter-spacing:-.01em;
}
.brand p{margin:3px 0 0; font-size:11.5px; color:var(--muted)}
.brand-row .icon{flex:none; margin-top:-2px}

.actions{padding:12px 16px; display:flex; flex-direction:column; gap:7px; border-bottom:1px solid var(--line)}
.btn{
  font:inherit; font-size:13px; font-weight:500; cursor:pointer; text-align:left;
  padding:8px 11px; border-radius:4px; border:1px solid var(--line);
  background:transparent; color:var(--ink); display:flex; align-items:center; gap:8px;
}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--surface)}
.btn.primary:hover{color:var(--surface); opacity:.9}
.btn kbd{
  margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--muted);
  border:1px solid var(--line); border-radius:3px; padding:0 4px;
}
.btn.primary kbd{color:var(--surface); border-color:#fff5}

.listhd{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:9px 16px 0; font-family:var(--mono); font-size:10px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
}
.link{
  font:inherit; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  cursor:pointer; background:none; border:none; color:var(--muted);
  padding:2px 0; text-decoration:underline; text-underline-offset:3px;
}
.link:hover{color:var(--warm)}
.link:disabled{cursor:default; opacity:.6; text-decoration:none}
.listhdBtns{display:flex; gap:12px}

.files{flex:1 1 auto; overflow-y:auto; min-height:0; padding:8px 8px 16px}
.files .empty{padding:14px 8px; font-size:12.5px; color:var(--muted); line-height:1.5}

.filerow{
  display:flex; align-items:stretch; border-radius:4px;
  border-left:2px solid transparent;
}
.filerow:hover{background:var(--surface-2)}
.filerow.cur{
  background:var(--accent-soft); border-left-color:var(--accent);
}
.file{
  flex:1 1 auto; min-width:0; text-align:left; font:inherit; font-size:13px;
  cursor:pointer; border:none; background:transparent; color:var(--ink);
  padding:7px 4px 7px 9px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.filerow.cur .file{color:var(--accent); font-weight:500}
.rm{
  flex:none; width:26px; font:inherit; font-size:15px; line-height:1; cursor:pointer;
  border:none; background:none; color:var(--muted); padding:0 6px 0 0;
  opacity:0; transition:opacity .12s, color .12s;
}
.filerow:hover .rm, .rm:focus-visible{opacity:1}
.rm:hover{color:var(--warm)}
.grp{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted); padding:12px 9px 4px;
}

.fold{border-top:1px solid var(--line); flex:none}
.fold > summary{
  cursor:pointer; padding:9px 16px; list-style:none;
  font-family:var(--mono); font-size:10px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--muted); display:flex; align-items:center; gap:7px; user-select:none;
}
.fold > summary::-webkit-details-marker{display:none}
.fold > summary::marker{content:""}
.fold > summary::after{
  content:"›"; margin-left:auto; font-size:13px; line-height:1;
  transition:transform .15s; transform-origin:50% 50%;
}
.fold[open] > summary::after{transform:rotate(90deg)}
.fold > summary:hover{color:var(--accent)}
.fold > summary:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.fold > .body{
  padding:0 16px 12px; font-size:10.5px; line-height:1.5; color:var(--muted);
}
.fold > .body b{color:var(--ink); font-weight:600}
.fold .k, .tip .k{
  font-family:var(--mono); font-size:9.5px; color:var(--ink);
  border:1px solid var(--line); border-radius:3px; padding:0 3px; white-space:nowrap;
}

.toc[open]{min-height:0; display:flex; flex-direction:column}
.toc > nav{max-height:34vh; overflow-y:auto; padding:0 8px 8px}
.toc a{
  display:block; font-size:12px; color:var(--muted); text-decoration:none;
  padding:3px 8px; border-radius:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.toc a:hover{color:var(--accent); background:var(--surface-2)}
.toc a.h3{padding-left:20px; font-size:11.5px}

.foot{
  padding:10px 16px; border-top:1px solid var(--line);
  display:flex; flex-wrap:wrap; gap:7px; align-items:center;
}
.icon{
  font:inherit; font-size:13px; cursor:pointer; background:none; border:1px solid var(--line);
  color:var(--muted); border-radius:4px; padding:5px 9px;
}
.icon:hover{border-color:var(--accent); color:var(--accent)}
.icon.on{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
.icon.warn{border-color:var(--warm); color:var(--warm)}

main{overflow-y:auto; min-height:0; position:relative; container-type:inline-size}
.topbar{
  position:sticky; top:0; z-index:10; background:var(--bg);
  border-bottom:1px solid var(--line); display:flex; align-items:center;
  gap:10px; padding:9px 20px;
}
.topbar .name{font-family:var(--mono); font-size:12px; color:var(--muted);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#search{
  margin-left:auto; font:inherit; font-size:13px; width:190px;
  padding:6px 10px; border-radius:4px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink);
}
#search:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent)}
.hits{font-family:var(--mono); font-size:11px; color:var(--muted); white-space:nowrap}

.drop{
  margin:0; padding:64px 24px; text-align:center; color:var(--muted);
}
.drop .big{
  font-family:var(--serif); font-size:24px; color:var(--ink); margin:0 0 8px;
}
.drop p{max-width:46ch; margin:0 auto 6px; font-size:14px}
.drop ol{max-width:44ch; margin:20px auto 0; text-align:left; font-size:13.5px; line-height:1.9}

.tip{
  max-width:46ch; margin:26px auto 0; padding:16px 18px;
  border:1px solid var(--line); border-radius:6px;
  background:var(--surface-2); text-align:left;
}
.tip h3{
  margin:0 0 4px; font-size:14px; font-weight:600; color:var(--ink);
  letter-spacing:-.01em;
}
.tip ol{margin:8px 0 0; padding-left:20px; max-width:none}
.tip .fine{
  margin:10px 0 0; max-width:none; font-size:12.5px;
  text-align:left; color:var(--muted);
}
.tip-movil{display:none}
@media (max-width:820px){
  .tip-movil{display:block}
  .tip-escritorio{display:none}
}

.tip-ios, .tip-instalar{display:none}
html[data-plat="ios"] .tip-movil,
html[data-plat="ios"] .tip-escritorio{display:none}
html[data-plat="ios"] .tip-ios{display:block}

html[data-plat="ios"]:not([data-modo="app"]) .tip-instalar{display:block}

html[data-plat="ios"] #pickFolder,
html[data-plat="ios"] #pickFolder2{display:none}
body.dragging main{outline:2px dashed var(--accent); outline-offset:-10px}

article{
  max-width:78ch; margin:0 auto; padding:var(--art-pad);
}
article h1,article h2,article h3,article h4{
  font-family:var(--serif); font-weight:600; letter-spacing:-.012em;
  text-wrap:balance; line-height:1.2; margin:var(--sp-h) 0 .35em;
}
article > h1:first-child{margin-top:0}
article h1{font-size:29px; padding-bottom:.3em; border-bottom:1px solid var(--line)}
article h2{font-size:22px; margin-top:var(--sp-h2)}
article h3{font-size:17.5px}
article h4{font-size:15.5px}
article p{margin:0 0 var(--sp-p)}
article ul,article ol{margin:0 0 var(--sp-p); padding-left:1.5em}
article li{margin:var(--sp-li) 0}
article li > ul,article li > ol{margin:var(--sp-li) 0}
article a{color:var(--accent); text-underline-offset:2px}
article hr{border:none; border-top:1px solid var(--line); margin:var(--sp-h2) 0}
article strong{font-weight:600}

blockquote{
  margin:0 0 var(--sp-p); padding:2px 0 2px 16px; border-left:3px solid var(--warm);
  color:var(--muted);
}
blockquote strong{color:var(--ink)}
blockquote > :last-child{margin-bottom:0}

code{
  font-family:var(--mono); font-size:.875em;
  background:var(--surface-2); border-radius:3px; padding:.12em .34em;
}
pre{
  font-family:var(--mono); font-size:13px; line-height:1.55;
  background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:3px; padding:10px 14px; margin:0 0 var(--sp-blk);
  overflow-x:auto; white-space:pre;
}
pre code{background:none; padding:0; font-size:inherit}

.tablewrap{overflow-x:auto; margin:0 0 var(--sp-blk)}
article > .tablewrap{
  --bleed:clamp(0px, (100cqw - 2 * var(--art-x) - 16px - 100%) / 2, 240px);
  width:calc(100% + 2 * var(--bleed));
  margin-left:calc(-1 * var(--bleed));
}
table{border-collapse:collapse; width:100%; font-size:13.5px}
th,td{border:1px solid var(--line); padding:7px 11px; text-align:left; vertical-align:top}
th{background:var(--surface-2); font-weight:600; font-size:12.5px}
td{font-variant-numeric:tabular-nums}

.mathblock.katex-on{
  font-family:inherit; font-size:inherit; line-height:1.3;
  background:transparent; border:none; padding:var(--sp-math);
  margin:0 0 var(--sp-blk);
}

.mathblock .katex-display{margin:var(--katex-disp) 0}
.katex{color:var(--ink)}
.mathblock{
  font-family:var(--mono); font-size:14.5px; text-align:center;
  background:var(--surface); border:1px solid var(--line); border-radius:3px;
  padding:var(--sp-mathfb); margin:0 0 var(--sp-blk); line-height:1.9;

  overflow-x:auto; overflow-y:hidden;
}
.mathinline{font-family:var(--mono); font-size:.9em; white-space:nowrap}
.boxed{border:1.5px solid var(--accent); border-radius:3px; padding:3px 9px; display:inline-block}
.frac{display:inline-block; vertical-align:middle; text-align:center; margin:0 .18em}
.frac .num{display:block; padding:0 .3em; border-bottom:1.2px solid currentColor; line-height:1.5}
.frac .den{display:block; padding:0 .3em; line-height:1.5}
.root{border-top:1.2px solid currentColor; padding:0 .15em}

.diagram{margin:0}
.diagram[data-diagram="listo"]{
  background:var(--surface); border:1px solid var(--line); border-radius:3px;
  padding:var(--sp-diag); margin:0 0 var(--sp-blk); text-align:center; line-height:1;

  overflow-x:auto; overflow-y:hidden;
}
.diagram[data-diagram="listo"] svg{max-width:100%; height:auto; vertical-align:middle}
.diagram-err{margin:0 0 var(--sp-blk); font-size:12.5px; line-height:1.4; color:var(--warm)}

.ampliar{
  position:absolute; top:6px; right:6px; z-index:1;
  display:inline-flex; align-items:center; justify-content:center;
  width:27px; height:27px; padding:0; cursor:zoom-in;
  font:inherit; font-size:13px; line-height:1;
  border:1px solid var(--line); border-radius:4px;
  background:var(--surface); color:var(--muted);
  opacity:0; transition:opacity .12s, color .12s;
}
.diagram:hover > .ampliar,
.chart:hover > .ampliar,
.ampliar:focus-visible{opacity:1}
.ampliar:hover{color:var(--accent)}
@media (hover:none){.ampliar{opacity:.9}}

.zoom{position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; background:var(--bg)}
.zoom-barra{
  display:flex; align-items:center; gap:6px; flex:none;
  padding:7px 10px; border-bottom:1px solid var(--line); background:var(--surface);
}
.zoom-barra .nombre{
  flex:1; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  font-size:12.5px; color:var(--muted);
}
.zoom-barra .nivel{
  flex:none; font-family:var(--mono); font-size:11.5px; color:var(--muted);
  font-variant-numeric:tabular-nums; min-width:4.5ch; text-align:right;
}
.zoom-barra button{
  flex:none; display:inline-flex; align-items:center; justify-content:center;
  width:30px; height:30px; padding:0; cursor:pointer;
  font:inherit; font-size:14px; line-height:1;
  border:1px solid var(--line); border-radius:4px;
  background:transparent; color:var(--ink);
}
.zoom-barra button:hover{border-color:var(--accent); color:var(--accent)}

.zoom-lienzo{
  flex:1; min-height:0; position:relative; overflow:hidden;
  touch-action:none; cursor:grab; overscroll-behavior:contain;
}
.zoom-lienzo.arrastrando{cursor:grabbing}

.ghmodal{
  position:fixed; inset:0; z-index:70; display:flex; align-items:center; justify-content:center;
  padding:16px; background:#0009;
}
.ghbox{
  width:100%; max-width:420px; max-height:calc(100vh - 32px); overflow-y:auto;
  background:var(--surface); border:1px solid var(--line); border-radius:8px;
  padding:20px 22px; box-shadow:0 12px 32px #0006;
}
.ghbox h2{margin:0 0 14px; font-family:var(--serif); font-size:17px; font-weight:600}
.ghbox form{display:flex; flex-direction:column; gap:5px}
.ghlabel{font-size:11.5px; color:var(--muted); margin-top:10px}
.ghbox input[type="text"],.ghbox input[type="password"]{
  font:inherit; font-size:13px; padding:8px 10px; border-radius:4px;
  border:1px solid var(--line); background:var(--bg); color:var(--ink);
}
.ghbox input[type="text"]:focus,.ghbox input[type="password"]:focus{outline:2px solid var(--accent-soft); border-color:var(--accent)}
.ghpriv{border-top:1px solid var(--line); margin-top:14px; padding-top:2px}
.ghpriv > summary{
  cursor:pointer; padding:8px 0; list-style:none; font-size:12.5px; color:var(--muted); user-select:none;
}
.ghpriv > summary::-webkit-details-marker{display:none}
.ghremember{display:flex; align-items:center; gap:6px; margin-top:8px; font-size:12.5px; color:var(--muted)}
.ghayuda{font-size:11.5px; line-height:1.5; color:var(--muted); margin:8px 0 0}
.ghayuda a{color:var(--accent)}
.ghmsg{font-size:12.5px; line-height:1.5; color:var(--warm); margin:12px 0 0}
.ghmsg.ok{color:var(--good)}
.ghbotones{display:flex; justify-content:flex-end; gap:8px; margin-top:16px}
.ghbotones .btn{flex:none}
.zoom-contenido{
  position:absolute; left:0; top:0; transform-origin:0 0;
  text-align:center; line-height:1;
}
.zoom-contenido svg{display:block; height:auto}
.zoom-contenido.chart{padding:4px 10px; text-align:left; line-height:var(--lh-prose)}

.token.comment,.token.prolog,.token.doctype,.token.cdata{color:var(--tk-comment); font-style:italic}
.token.punctuation{color:var(--muted)}
.token.keyword,.token.atrule,.token.important,.token.tag,.token.selector{color:var(--tk-keyword)}
.token.string,.token.char,.token.attr-value,.token.regex,.token.url{color:var(--tk-string)}
.token.number,.token.boolean,.token.constant,.token.symbol,.token.entity{color:var(--tk-number)}
.token.function{color:var(--tk-function)}
.token.class-name,.token.builtin,.token.attr-name,.token.property{color:var(--tk-type)}
.token.important{font-weight:600}
.token.namespace{opacity:.75}

.doctoc{
  margin:0 0 var(--sp-blk); padding:10px 16px 10px 14px;
  background:var(--surface); border:1px solid var(--line); border-radius:3px;
  font-size:14px; line-height:1.45;
}
.doctoc-t{
  margin:0 0 6px; font-family:var(--mono); font-size:10px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--muted);
}
article .doctoc ol{list-style:none; margin:0; padding:0}
article .doctoc ol ol{padding-left:1.15em; margin:.1em 0 .25em}
article .doctoc li{margin:.12em 0}
article .doctoc a{text-decoration:none}
article .doctoc a:hover{text-decoration:underline}
article .doctoc > ol > li > a{font-weight:500}

.chart{margin:0}
.chart[data-chart="listo"]{
  background:var(--surface); border:1px solid var(--line); border-radius:3px;
  padding:10px 14px 8px; margin:0 0 var(--sp-blk);
}
.chart-titulo{margin:0 0 4px; font-size:13.5px; font-weight:600; line-height:1.3; color:var(--ink)}
.chart-leyenda{
  display:flex; flex-wrap:wrap; gap:2px 14px; margin:0 0 6px;
  font-size:12px; line-height:1.4; color:var(--muted);
}
.chart-leyenda span{display:inline-flex; align-items:center; gap:6px}

.chart-leyenda i,.chart-tip i{flex:none; background:currentColor}
.chart-leyenda i{width:10px; height:10px; border-radius:2px}
.chart-leyenda.lineas i{width:14px; height:2px; border-radius:1px}
.chart-leyenda.dispersion i{width:9px; height:9px; border-radius:50%}
.chart-lienzo{position:relative}
.chart-lienzo svg{display:block; width:100%; height:auto; overflow:visible; touch-action:pan-y}
.chart text{fill:var(--muted); font-family:var(--sans); font-size:11px; font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--line); stroke-width:1}
.chart .base{stroke:var(--muted); stroke-opacity:.6; stroke-width:1}
.chart .barra{fill:currentColor; transition:opacity .12s}
.chart svg.hover .grupo:not(.activo) .barra{opacity:.4}
.chart .linea{fill:none; stroke:currentColor; stroke-width:2; stroke-linejoin:round; stroke-linecap:round}

.chart .area{fill:currentColor; fill-opacity:.16; stroke:none}

.chart .porcion{fill:currentColor; stroke:var(--surface); stroke-width:2; transition:opacity .12s}
.chart svg.hover .porcion:not(.activo){opacity:.4}
.chart .punto{fill:currentColor; stroke:var(--surface); stroke-width:2}
.chart .cruz{stroke:var(--muted); stroke-width:1; visibility:hidden}
.chart .cruz.ver{visibility:visible}
.chart .zona{fill:transparent}
.chart .s1{color:var(--serie-1)} .chart .s2{color:var(--serie-2)}
.chart .s3{color:var(--serie-3)} .chart .s4{color:var(--serie-4)}
.chart .s5{color:var(--serie-5)} .chart .s6{color:var(--serie-6)}
.chart .s7{color:var(--serie-7)} .chart .s8{color:var(--serie-8)}
.chart-tip{
  position:absolute; z-index:2; pointer-events:none; max-width:min(260px,100%);
  background:var(--surface); border:1px solid var(--line); border-radius:4px;
  box-shadow:0 2px 10px #0003; padding:6px 9px; font-size:12px; line-height:1.4;
}
.chart-tip .cat{color:var(--muted); margin-bottom:2px}
.chart-tip .fila{display:flex; align-items:center; gap:6px}
.chart-tip i{width:10px; height:2px; border-radius:1px}
.chart-tip b{font-weight:600; font-variant-numeric:tabular-nums; color:var(--ink)}
.chart-tip span{color:var(--muted)}
.chart-datos{margin:4px 0 0; font-size:12.5px}
.chart-datos > summary{cursor:pointer; width:fit-content; font-size:11.5px; color:var(--muted)}
.chart-datos > summary:hover{color:var(--accent)}
.chart-datos .tablewrap{margin:6px 0 2px}
.chart-datos td.num{text-align:right}

.diagram[data-diagram="listo"],
.chart[data-chart="listo"]{
  --bleed:clamp(0px, (100cqw - 2 * var(--art-x) - 16px - 100%) / 2, 240px);
  width:calc(100% + 2 * var(--bleed));
  margin-left:calc(-1 * var(--bleed));
  position:relative;
}

mark{background:#F6D66B; color:#1A1D26; border-radius:2px}

@media print{

  :root{
    --lh-prose:1.3;
    --sp-p:.35em; --sp-h:.75em; --sp-h2:.95em; --sp-blk:.4em;
    --sp-math:4px 0; --sp-mathfb:4px 8px; --sp-diag:4px 6px; --sp-li:.06em;
    --art-x:0px; --art-pad:0; --katex-disp:.08em;
  }
  @page{margin:14mm}
  aside,.topbar,.scrim,.ampliar,.zoom{display:none!important}

  .diagram[data-diagram="listo"],.chart[data-chart="listo"]{--bleed:0px}
  .app{display:block; height:auto}
  main{overflow:visible}
  body{background:#fff; color:#000; font-size:10.5pt}
  article{max-width:none; padding:0}
  article h1{font-size:19pt} article h2{font-size:15pt}
  article h3{font-size:12.5pt} article h4{font-size:11pt}
  pre{font-size:9pt; padding:6px 9px}
  table{font-size:9.5pt} th,td{padding:3px 6px}
  pre,.mathblock,table,th,td{border-color:#bbb}
  pre{border-left-color:#666}

  .diagram[data-diagram="listo"]{background:none; border-color:#bbb}
  article h1,article h2,article h3,article h4{break-after:avoid}
  pre,.mathblock,.diagram,.chart,table,blockquote{break-inside:avoid}

  :root:not([data-theme="light"]){
    --tk-comment:#6B6F80; --tk-keyword:#34399B; --tk-string:#2F6B4F;
    --tk-number:#B0452E;  --tk-function:#7A3E9D; --tk-type:#8A5A00;
    --serie-1:#2a78d6; --serie-2:#eb6834; --serie-3:#1baf7a; --serie-4:#eda100;
    --serie-5:#e87ba4; --serie-6:#008300; --serie-7:#4a3aa7; --serie-8:#e34948;
  }

  .chart{--surface:#fff; --line:#ddd; --muted:#555}
  .chart[data-chart="listo"],.doctoc{background:none; border-color:#bbb}
  .chart-tip{display:none!important}
  .chart-datos:not([open]){display:none}
  .doctoc a{color:#000}
}

#updBar{
  position:fixed; left:16px; right:16px; bottom:16px; margin:0 auto;
  z-index:50; display:flex; align-items:center; justify-content:space-between;
  gap:12px; width:fit-content; max-width:calc(100vw - 32px);
  padding:10px 12px 10px 16px; border-radius:6px;
  background:var(--accent); color:#fff;
  font-size:13px; line-height:1.35; box-shadow:0 4px 16px #0004;
}
#updBar button{
  font:inherit; font-size:12.5px; font-weight:600; cursor:pointer;
  padding:6px 12px; border-radius:4px; white-space:nowrap;
  border:1px solid #fff6; background:#fff2; color:#fff;
}
#updBar button:hover{background:#fff3}
#updBar button:disabled{cursor:default; opacity:.72}

@media print{ #updBar{display:none!important} }

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<div class="app">
  <aside id="side">

        <button class="btn" id="pickGithub" data-t="importarGithub"></button>

    </div>

    <div class="files" id="files">

    <details class="fold toc" id="tocWrap" hidden open>

    </div>
  </aside>

  <main id="main">

        </ol>
        <p class="fine" data-t="tipMovilFine"></p>

      <div class="tip tip-ios">

        </ol>
        <p class="fine" data-t="tipIosFine"></p>

        </ol>
        <p class="fine" data-t="tipInstFine"></p>

          <li data-t="tipEsc3"></li>
        </ol>

    <article id="doc" hidden></article>
  </main>
</div>

<div class="zoom" id="zoom" hidden>

</div>

function idiomaInicial(){
  try{
    const guardado = localStorage.getItem("lectormd-lang");
    if(guardado === "es" || guardado === "en") return guardado;
  }catch(e){}
  const lista = navigator.languages && navigator.languages.length
    ? navigator.languages
    : [navigator.language || ""];

  for(const l of lista){
    const base = String(l).slice(0, 2).toLowerCase();
    if(base === "es" || base === "en") return base;
  }
  return "en";
}

let IDIOMA = idiomaInicial();

const ES_IOS = (() => {
  const ua = navigator.userAgent || "";
  return /iPad|iPhone|iPod/.test(ua) ||
    (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
})();

if(ES_IOS){
  const raiz = document.documentElement;
  raiz.dataset.plat = "ios";

  if(navigator.standalone === true ||
     (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)){
    raiz.dataset.modo = "app";
  }

  ["pickFiles", "pickFiles2"].forEach(id => {
    const b = document.getElementById(id);
    if(b) b.classList.add("primary");
  });

  const inFiles = document.getElementById("inFiles");
  if(inFiles) inFiles.removeAttribute("accept");
}

const t = (clave, ...args) => {

  const dic = TEXTOS[IDIOMA];
  const v = ES_IOS && (clave + "IOS") in dic ? dic[clave + "IOS"] : dic[clave];
  return typeof v === "function" ? v(...args) : v;
};

function traducirPagina(){
  document.documentElement.lang = IDIOMA;
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = t(el.dataset.t); });
  document.querySelectorAll("[data-t-title]").forEach(el => { el.title = t(el.dataset.tTitle); });
  document.querySelectorAll("[data-t-placeholder]").forEach(el => { el.placeholder = t(el.dataset.tPlaceholder); });
  document.querySelectorAll("[data-t-aria]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.tAria)); });
}

traducirPagina();
</script>

<script type="text/markdown" id="ayudaSrc-es" lang="es">
# Lector MD — documento de ejemplo

Este archivo es el manual y la demostración al mismo tiempo. En cada sección
aparece primero **cómo se escribe** algo, en un recuadro con el texto tal cual
va en el archivo, y después **cómo se ve** en el lector.

Si lo estás leyendo en GitHub, algunos resultados se van a ver distinto: esa es
justamente la gracia. Descargalo y abrilo en el lector.

![Un pendrive del que sale una hoja escrita, y al lado una nube tachada: los
archivos se leen desde donde estén, sin pasar por internet](ejemplo-portada.png)

[TOC]

## Qué es esto

Un lector de archivos Markdown que funciona **sin internet** y **sin subir nada
a ningún lado**. El archivo se lee en tu propia máquina y se muestra ahí mismo.

Es un solo `index.html`. No hay servidor que procese tus documentos, no hay
cuenta, no hay sincronización. Podés copiar ese único archivo a un pendrive y
leer tus `.md` en cualquier computadora con navegador.

Instalado como app tiene dos cosas más:

- En **Android** aparece en el menú *Compartir*: mandás un `.md` desde WhatsApp,
  Drive o el explorador y se abre acá.
- En **escritorio** aparece en *Abrir con*.

## Todo lo que hace, de un vistazo

| | |
|---|---|
| **Abrir** | una carpeta entera con sus subcarpetas, archivos sueltos, o arrastrando y soltando |
| **Desde otras apps** | en Android por el menú *Compartir*; en escritorio, por *Abrir con* |
| **Markdown** | encabezados, listas anidadas, tablas, código, citas, énfasis, enlaces |
| **Fórmulas** | con KaTeX si hay conexión, en Unicode si no |
| **Diagramas** | con Mermaid, que se baja sólo si el archivo tiene alguno |
| **Código** | con colores para JavaScript, TypeScript, Python, HTML, CSS, Java, C y C# |
| **Gráficos** | de barras, de líneas, de área, de dispersión y de torta, a partir de una tabla de datos escrita en el archivo |
| **Navegar** | índice de secciones en el panel lateral, tabla de contenidos dentro del documento con `[TOC]`, y `Alt`+`J` / `Alt`+`K` entre archivos |
| **Buscar** | dentro del documento abierto, desde dos caracteres, con resaltado |
| **Imprimir** | o guardar en PDF, con estilos propios para papel |
| **Ver** | tema claro u oscuro, interlineado cómodo o compacto |
| **Idioma** | español o inglés, según el navegador, con un botón para cambiarlo |
| **Recordar** | qué archivos cargaste, cuál leías y en qué parte de cada uno |
| **Funcionar** | sin conexión, sin servidor, con un solo archivo que podés llevar a cualquier lado |
| **Actualizarse** | sola, sin perder lo que tenías abierto |

## Cómo abrir archivos

### Desde la app

Tenés tres caminos, todos equivalentes:

1. **Abrir carpeta** — elegís una carpeta entera y lista todos los `.md` que haya
   adentro, incluidos los de subcarpetas. Es la opción recomendada.
2. **Abrir archivos sueltos** — elegís uno o varios archivos puntuales.
3. **Arrastrar y soltar** — tirás los archivos sobre la zona de lectura.

En pantallas chicas el panel lateral se esconde; el botón **☰** de la barra
superior lo abre.

### Desde otra app, en el celular

En el chat o en el explorador, tocá el ícono de **compartir** del archivo y
elegí **Lector MD** en la lista.

> Es **compartir**, no *abrir con*. En Android, Chrome no implementa la API que
> haría falta para aparecer en *abrir con*, así que el camino es el otro.

## Qué entiende del Markdown

Cada ejemplo tiene dos partes: el recuadro con el texto tal como se escribe en
el archivo y, debajo de **Se ve así**, el resultado.

### Texto

~~~markdown
Se puede poner *cursiva* con asteriscos o _con guiones bajos_, **negrita**,
***negrita y cursiva*** juntas, ~~texto tachado~~ y `código en línea`.
~~~

Se ve así:

Se puede poner *cursiva* con asteriscos o _con guiones bajos_, **negrita**,
***negrita y cursiva*** juntas, ~~texto tachado~~ y `código en línea`.

Los párrafos se separan con una línea en blanco. Un salto de línea suelto
**no** corta el párrafo: las líneas se unen, como en el Markdown clásico. Por
eso las dos líneas del ejemplo se ven como una sola.

### Citas

~~~markdown
> Una cita ocupa su propio bloque y puede tener **formato adentro**.
~~~

Se ve así:

> Una cita ocupa su propio bloque y puede tener **formato adentro**.

### Separadores

Tres guiones solos en una línea dibujan una raya horizontal:

~~~markdown
---
~~~

Se ve así:

---

### Encabezados

~~~markdown
# Título del documento
## Sección
### Subsección
~~~

Van de `#` a `######`: cuantos más numerales, más chico el título. No hay un
resultado aparte porque los títulos de este mismo documento están escritos
así; este, por ejemplo, lleva `###`.

Los de nivel 1 a 3 arman el índice **En este archivo** del panel lateral y la
tabla de contenidos que se explica a continuación.

### Tabla de contenidos

~~~markdown
[TOC]
~~~

Escribí `[TOC]` solo en una línea, donde quieras que aparezca. Ahí se arma la
lista de encabezados de nivel 1 a 3, con un enlace a cada sección. El resultado
es el **Contenido** que está al principio de este archivo.

Si el documento tiene un único `#`, se toma como el título y no se lista.
También sirve `[[_TOC_]]`, como en GitLab. A diferencia del índice del panel
lateral, la tabla de contenidos sale impresa.

### Listas

~~~markdown
- Un ítem
- Otro ítem
  - Anidado un nivel
  - Otro anidado
- Vuelta al primer nivel

1. Primer paso
2. Segundo paso
   1. Subpaso
   2. Otro subpaso
3. Tercer paso
~~~

Se ve así:

- Un ítem
- Otro ítem
  - Anidado un nivel
  - Otro anidado
- Vuelta al primer nivel

1. Primer paso
2. Segundo paso
   1. Subpaso
   2. Otro subpaso
3. Tercer paso

Las viñetas aceptan `-`, `*` o `+`, y las numeradas `1.` o `1)`.

### Tablas

~~~markdown
| Elemento | Sintaxis | Aparece en el índice |
|---|---|---|
| Encabezado | `#` a `######` | niveles 1 a 3 |
| Cita | signo mayor | no |
| Fórmula | `$$` o valla `math` | no |
~~~

Se ve así:

| Elemento | Sintaxis | Aparece en el índice |
|---|---|---|
| Encabezado | `#` a `######` | niveles 1 a 3 |
| Cita | signo mayor | no |
| Fórmula | `$$` o valla `math` | no |

La fila de guiones debajo del encabezado es obligatoria. Las tablas anchas
scrollean solas en horizontal.

### Código

Con vallas de tres acentos graves. Si le ponés el lenguaje al lado, se
resaltan las palabras clave, los textos, los números y los comentarios:

~~~markdown
```python
def promedio(valores):
    """Devuelve el promedio, o None si la lista está vacía."""
    if not valores:
        return None
    return sum(valores) / len(valores)
```
~~~

Se ve así:

```python
def promedio(valores):
    """Devuelve el promedio, o None si la lista está vacía."""
    if not valores:
        return None
    return sum(valores) / len(valores)
```

Estos son los lenguajes con colores y cómo se escribe cada uno:

| Lenguaje | Al lado de la valla |
|---|---|
| JavaScript | `js`, `javascript`, `json` |
| TypeScript | `ts`, `typescript` |
| Python | `py`, `python` |
| HTML y XML | `html`, `xml`, `svg` |
| CSS | `css` |
| Java | `java` |
| C | `c`, `h` |
| C# | `cs`, `csharp`, `c#` |

Los colores los pone **Prism**, que pesa unos 33 KB y se baja la primera vez
que abrís un archivo con código de alguno de estos lenguajes; después queda
guardado. Siguen el tema del lector y al imprimir salen con los del tema
claro. Sin conexión, o con cualquier otro lenguaje, el bloque se ve igual pero
en un solo color.

También sirve un bloque indentado con cuatro espacios, que queda sin colores:

~~~markdown
    esto también es código
    por estar indentado
~~~

Se ve así:

    esto también es código
    por estar indentado

### Fórmulas

Las fórmulas **en línea** van entre signos pesos, dentro de una oración:

~~~markdown
La energía en reposo es $E = mc^2$.
~~~

Se ve así:

La energía en reposo es $E = mc^2$.

Las fórmulas **de bloque** van solas en su línea, entre doble signo pesos:

~~~markdown
$$\int_0^1 x^2\,dx = \frac{1}{3}$$
~~~

Se ve así:

$$\int_0^1 x^2\,dx = \frac{1}{3}$$

También funciona una valla con lenguaje `math`, `latex` o `tex`, al estilo de
GitHub:

~~~markdown
```math
\sum_{i=1}^{n} i = \frac{n(n+1)}{2}
```
~~~

Se ve así:

```math
\sum_{i=1}^{n} i = \frac{n(n+1)}{2}
```

Si hay conexión se dibujan con **KaTeX**: tipografía matemática de verdad. Si
no, caen a una aproximación en Unicode que se lee bien igual.

### Diagramas

Una valla con lenguaje `mermaid` se dibuja como diagrama:

~~~markdown
```mermaid
flowchart LR
  W[WhatsApp] -->|compartir| SW[Service worker]
  SW --> C[(Cache)]
  C --> APP[Lector MD]
  APP --> IDB[(IndexedDB)]
```
~~~

Se ve así:

```mermaid
flowchart LR
  W[WhatsApp] -->|compartir| SW[Service worker]
  SW --> C[(Cache)]
  C --> APP[Lector MD]
  APP --> IDB[(IndexedDB)]
```

Sirven los tipos de **Mermaid**: flujos, secuencias, clases, estados, Gantt.
Por ejemplo, uno de estados:

~~~markdown
```mermaid
stateDiagram-v2
  [*] --> Vacio
  Vacio --> Leyendo: abrir carpeta
  Leyendo --> Imprimiendo: boton PDF
  Imprimiendo --> Leyendo
```
~~~

Se ve así:

```mermaid
stateDiagram-v2
  [*] --> Vacio
  Vacio --> Leyendo: abrir carpeta
  Leyendo --> Imprimiendo: boton PDF
  Imprimiendo --> Leyendo
```

Los diagramas siguen el tema del lector, y al imprimir se redibujan en claro
para que salgan legibles en papel.

Si la ventana da, el dibujo se estira más allá de la columna de texto. Y
cuando aun así queda chico -un Gantt largo, un gráfico con muchas barras- el
botón **⤢** de la esquina, o un clic en el diagrama, lo abren a pantalla
completa: rueda o pellizco para acercar, arrastre para mover, `Esc` para
volver.

La librería de diagramas pesa unos 3 MB, así que **se baja recién cuando abrís
un archivo que tiene alguno**. Después queda guardada y funciona sin conexión.
Si no se puede bajar, el bloque se queda mostrando el código del diagrama, que
se lee igual.

### Gráficos

Una valla con lenguaje `grafico` (o `chart`) dibuja un gráfico de barras, de
líneas, de área, de dispersión o de torta. Arriba van las opciones, una por
línea; después, los datos. La primera fila de datos es el encabezado: la
primera columna tiene las categorías y cada una de las siguientes es una serie.

~~~markdown
```grafico
tipo: barras
titulo: Horas de estudio por semana
unidad: h

Semana, Análisis, Programación
1, 6, 4
2, 5, 7
3, 8, 6
4, 7, 9
```
~~~

Se ve así:

```grafico
tipo: barras
titulo: Horas de estudio por semana
unidad: h

Semana, Análisis, Programación
1, 6, 4
2, 5, 7
3, 8, 6
4, 7, 9
```

Las columnas se separan con comas. Si los números llevan **coma decimal**,
separá las columnas con punto y coma:

~~~markdown
```grafico
tipo: lineas
titulo: Tiempo de respuesta según la carga
unidad: ms

Usuarios; Con caché; Sin caché
10; 12; 35
50; 14; 80
100; 15,5; 160
200; 18; 340
400; 25; 700
```
~~~

Se ve así:

```grafico
tipo: lineas
titulo: Tiempo de respuesta según la carga
unidad: ms

Usuarios; Con caché; Sin caché
10; 12; 35
50; 14; 80
100; 15,5; 160
200; 18; 340
400; 25; 700
```

El **área** es una línea con la superficie pintada hasta el cero. Va bien para
un acumulado, donde lo que se mira es cuánto se juntó:

~~~markdown
```grafico
tipo: area
titulo: Páginas leídas en el mes
unidad: pág.

Semana, Leídas
1, 40
2, 95
3, 130
4, 210
```
~~~

Se ve así:

```grafico
tipo: area
titulo: Páginas leídas en el mes
unidad: pág.

Semana, Leídas
1, 40
2, 95
3, 130
4, 210
```

La **dispersión** no une los puntos. Si las categorías son números, el eje
horizontal también lo es y cada punto cae en su lugar, así que un salto en los
datos se ve como un hueco y no repartido parejo:

~~~markdown
```grafico
tipo: dispersion
titulo: Nota según las horas de estudio

Horas, Nota
2, 4
3, 5
5, 7
6, 6
9, 9
12, 10
```
~~~

Se ve así:

```grafico
tipo: dispersion
titulo: Nota según las horas de estudio

Horas, Nota
2, 4
3, 5
5, 7
6, 6
9, 9
12, 10
```

La **torta** reparte un total entre sus categorías, con el porcentaje de cada
porción al costado. Lleva una sola columna de valores, sin negativos, y hasta
ocho porciones:

~~~markdown
```grafico
tipo: torta
titulo: De dónde salen las visitas

Origen, Visitas
Buscadores, 540
Directo, 260
Redes, 150
Enlaces, 50
```
~~~

Se ve así:

```grafico
tipo: torta
titulo: De dónde salen las visitas

Origen, Visitas
Buscadores, 540
Directo, 260
Redes, 150
Enlaces, 50
```

| Opción | Qué hace | Si no la ponés |
|---|---|---|
| `tipo` | `barras`, `lineas`, `area`, `dispersion` o `torta` | barras |
| `titulo` | texto arriba del gráfico | sin título |
| `unidad` | texto sobre el eje vertical y al lado de cada valor | nada |
| `min`, `max` | un valor que el eje tiene que incluir, como `min: 0` | se calcula solo |

Algunos detalles:

- Las opciones también se entienden en inglés: `type`, `title` y `unit`, con
  `bar`, `line`, `area`, `scatter` o `pie`.
- También sirven tabulaciones, que es lo que queda al copiar celdas de una
  planilla, y barras verticales: una tabla Markdown pegada adentro de la valla
  funciona tal cual.
- Una celda vacía deja un hueco: la barra no aparece y la línea se corta.
- Entran hasta 8 series, una por color. Con más, conviene partir el gráfico.
  En la torta el límite son 8 porciones, por el mismo motivo.
- Las barras y el área arrancan siempre del cero, porque lo que se lee es el
  tamaño; las líneas y los puntos, sólo si los datos quedan cerca.
- Los números van sin separador de miles: `1234`, no `1.234`.

Al pasar el mouse, o al tocar con el dedo, se ven los valores de esa
categoría, y en la torta también el porcentaje. Abajo, **Ver datos** muestra la
misma información como tabla. Si los datos tienen un error, el bloque se queda
mostrando el texto de la valla, con un aviso de qué falló.

A diferencia de los diagramas, los gráficos los dibuja el propio lector, sin
bajar nada: funcionan sin conexión desde el primer momento.

### Enlaces e imágenes

~~~markdown
Un [enlace común](https://mdreader.jhproyectos.com.ar), y una dirección suelta
que se convierte sola: https://github.com/JHProyectos/mdreader-pwa
~~~

Se ve así:

Un [enlace común](https://mdreader.jhproyectos.com.ar), y una dirección suelta
que se convierte sola: https://github.com/JHProyectos/mdreader-pwa

Las imágenes llevan un signo de admiración adelante, y lo que va entre
corchetes es el texto alternativo. La ilustración del principio está escrita
así:

~~~markdown
![Un pendrive del que sale una hoja escrita](ejemplo-portada.png)
~~~

Se achican para entrar en la columna. Ojo: una imagen con ruta relativa sólo se
ve si esa ruta existe donde estás abriendo el archivo. El lector recibe el
texto del `.md`, no la carpeta.

Los wiki-links se muestran como código, no como enlace, porque el lector no
tiene forma de saber a qué archivo apuntan:

~~~markdown
Ver también [[otra nota]].
~~~

Se ve así:

Ver también [[otra nota]].

## Codificación de los archivos

Esta es la parte que más problemas suele dar, así que conviene ser preciso.

### Texto de los archivos

Los archivos se leen **siempre como UTF-8**. No hay detección automática de
codificación ni forma de elegir otra.

En la práctica no vas a notarlo, porque UTF-8 es lo que usan hoy todos los
editores. Pero si un archivo viejo fue guardado en *Latin-1* o
*Windows-1252*, los acentos y las eñes van a aparecer rotos.

La solución es del lado del archivo, no del lector: abrilo en cualquier editor
y guardalo de nuevo como UTF-8.

### Finales de línea

Da igual cómo estén guardados. El lector normaliza los tres estilos:

| Estilo | De dónde viene |
|---|---|
| `LF` | Linux, macOS |
| `CRLF` | Windows |
| `CR` | Mac clásico |

### Extensiones

Se aceptan tres: `.md`, `.markdown` y `.txt`. Cuando abrís una carpeta, el
lector filtra por esas extensiones e ignora todo lo demás.

Un `.txt` se procesa como Markdown igual que los otros. Si adentro no tiene
sintaxis de Markdown, simplemente se ve como texto.

## Leer, navegar, buscar e imprimir

### Navegar

Para moverte dentro de un documento largo hay dos índices:

- **En este archivo**, en el panel lateral, lista los encabezados de nivel 1
  a 3. Tocás uno y el documento salta a esa sección. Aparece cuando hay más de
  dos encabezados; en el celular está adentro del panel que abre **☰**.
- **La tabla de contenidos** va dentro del propio documento, donde se escriba
  `[TOC]`. Es el **Contenido** del principio de este archivo, y sus enlaces
  también llevan a cada sección. A diferencia del panel, sale impresa. Cómo se
  escribe está en *Tabla de contenidos*, más arriba.

Para pasar de un archivo a otro, tocás su nombre en la lista o usás `Alt` + `J`
para el siguiente y `Alt` + `K` para el anterior. Cada archivo recuerda hasta
dónde leíste, así que al volver seguís en el mismo lugar.

### Buscar

El campo de arriba busca en el documento abierto y resalta las coincidencias,
desde dos caracteres en adelante. No busca en los otros archivos de la lista,
sólo en el que estás leyendo.

El texto de los diagramas queda afuera de la búsqueda: un diagrama dibujado es
una imagen vectorial, y resaltar ahí adentro haría desaparecer el texto. Por lo
mismo, en los gráficos se buscan el título, la leyenda y la tabla de **Ver
datos** cuando está abierta, pero no los números de los ejes.

### Cómodo o compacto

El botón **⇕** del panel alterna entre dos densidades de lectura. No cambia el
tamaño de la letra: cambia el aire, o sea el interlineado y la separación entre
párrafos, títulos y bloques.

| | Cómodo | Compacto |
|---|---|---|
| Interlineado | 1.6 | 1.38 |
| Entre párrafos | amplio | mínimo |
| Margen de la hoja | generoso | ajustado |

**Cómodo** viene puesto de fábrica y es para leer en pantalla sin cansarte.
**Compacto** aprieta todo para que entre más contenido de una: sirve para
revisar un documento largo de un vistazo. La elección queda guardada, así que
la próxima vez abrís como lo dejaste.

Al **imprimir siempre sale compacto**, estés como estés en pantalla. Es a
propósito: en papel el aire de más se traduce en hojas de más.

El botón **◐** de al lado hace lo mismo con el tema, entre claro y oscuro, y
también se acuerda de tu elección.

### Idioma

La interfaz y esta ayuda están en español y en inglés. De entrada se usa el
idioma del navegador; el botón **EN** del panel pasa a inglés y, una vez ahí,
**ES** vuelve a español. La elección queda guardada.

El idioma no toca tus archivos: cada documento se muestra tal como está
escrito.

### Imprimir o guardar en PDF

El botón **⎙ PDF** abre el diálogo de impresión del navegador, que también
sirve para guardar en PDF. Hay una hoja de estilos aparte para impresión, así
que en papel no salen ni el panel lateral ni la barra superior.

Para que numere las hojas, en el diálogo abrí *Más opciones* y activá
*Encabezados y pies de página*. Eso lo hace el navegador; no se puede pedir
desde el documento. Por la misma razón, la tabla de contenidos sale impresa
pero sin números de página.

### Atajos

| Atajo | Qué hace |
|---|---|
| `Ctrl` + `F` | ir al campo de búsqueda |
| `Esc` | limpiar la búsqueda |
| `Alt` + `J` | archivo siguiente |
| `Alt` + `K` | archivo anterior |

### Lo que queda guardado

Los archivos que cargaste, cuál estabas leyendo y en qué parte de cada uno
ibas: todo eso se guarda en tu navegador y vuelve tal cual la próxima vez,
incluso después de una actualización de la app.

Se guarda en tu máquina, no en un servidor. **Limpiar todo** vacía la lista
del lector, y nunca borra archivos de tu disco.

## Pedirle a una IA un archivo que use todo

Si querés probar el lector con algo tuyo, la forma más rápida es pedirle a
ChatGPT, Claude o el que uses que te genere un `.md` que ejercite todas las
funciones. El problema de pedirlo suelto es que los modelos escriben Markdown
"de GitHub", con cosas que este lector no interpreta, y el resultado se ve a
medias.

Copiá este pedido, cambiá el tema por el que quieras y pegalo tal cual:

```
Necesito un archivo Markdown de prueba, en español, sobre CAMBIÁ ESTO POR TU TEMA.

Tiene que usar todo lo siguiente, porque lo voy a abrir en un lector que soporta
exactamente esta sintaxis:

- Encabezados de nivel 1 a 3, al menos cinco en total, para que se arme un índice
- La línea [TOC] sola, justo después del título, para la tabla de contenidos
- Párrafos normales, con negrita, cursiva, tachado y código en línea
- Una lista con viñetas que tenga un nivel de anidado, y una lista numerada
- Una cita, con algo en negrita adentro
- Una tabla de tres columnas con encabezado
- Un bloque de código con el lenguaje declarado, en uno de estos: js, ts, python, html, css, java, c o csharp
- Una fórmula matemática en línea y otra de bloque, en LaTeX
- Un diagrama Mermaid de flujo y otro de secuencia
- Un gráfico de cada tipo, cada uno en una valla con lenguaje grafico: primero las líneas "tipo: ..." (barras, lineas, area, dispersion o torta) y "titulo: ...", después una línea vacía y los datos separados por comas, con la primera fila como encabezado y la primera columna como categorías. En el de torta, una sola columna de valores, todos positivos, y hasta ocho filas; en el de dispersión conviene que las categorías sean números
- Una regla horizontal

No uses nada de esto, porque el lector no lo interpreta y queda a la vista como
texto crudo: listas de tareas con casillas para tildar, notas al pie, etiquetas
HTML sueltas, enlaces por referencia con la definición al final, ni encabezados
subrayados en vez de encabezados con numeral.

Devolvémelo como un único bloque de Markdown crudo, listo para guardar como
archivo .md en UTF-8.
```

Guardá la respuesta como `prueba.md` y abrila con **Abrir archivos sueltos**. Si
algo se ve como texto crudo en vez de renderizado, es casi seguro que el modelo
metió alguna de las cosas de la lista de abajo.

## Lo que no hace

Es un lector deliberadamente chico, con un parser propio. Estas cosas de
Markdown no están:

- **Listas de tareas.** Las casillas de tildar se ven como texto.
- **Notas al pie.** Quedan como están escritas.
- **HTML adentro del Markdown.** Se muestra como texto, no se interpreta. Es a
  propósito: los archivos llegan de afuera y no se ejecuta nada de lo que traen.
- **Enlaces por referencia**, con la definición aparte al final.
- **Encabezados subrayados**, los que se marcan con guiones o iguales debajo
  del texto. Usá `#`.
- **Editar.** Es un lector: muestra archivos, no los modifica.

---

Si algo de acá no se ve como esperabas, el lugar para contarlo es
https://github.com/JHProyectos/mdreader-pwa

# Lector MD — sample document

This file is the manual and the demo at the same time. Each section first
shows **how something is written**, in a box with the text exactly as it goes
in the file, and then **how it looks** in the reader.

If you're reading this on GitHub, some results will look different: that's
the whole point. Download it and open it in the reader.

![A USB stick with a written page coming out of it, next to a crossed-out
cloud: files are read from wherever they are, without going online](ejemplo-portada.png)

[TOC]

## What this is

A Markdown file reader that works **offline** and **without uploading anything
anywhere**. The file is read on your own machine and shown right there.

It's a single `index.html`. There's no server processing your documents, no
account, no sync. You can copy that one file to a USB stick and read your `.md`
files on any computer with a browser.

Installed as an app, it does two more things:

- On **Android** it shows up in the *Share* menu: send a `.md` from WhatsApp,
  Drive or the file manager and it opens here.
- On **desktop** it shows up in *Open with*.

## Everything it does, at a glance

| | |
|---|---|
| **Open** | a whole folder with its subfolders, individual files, or by dragging and dropping |
| **From other apps** | on Android through the *Share* menu; on desktop, through *Open with* |
| **Markdown** | headings, nested lists, tables, code, quotes, emphasis, links |
| **Formulas** | with KaTeX when online, in Unicode when not |
| **Diagrams** | with Mermaid, downloaded only if the file has one |
| **Code** | colored for JavaScript, TypeScript, Python, HTML, CSS, Java, C and C# |
| **Charts** | bar, line, area, scatter and pie charts, from a data table written in the file |
| **Navigate** | section index in the side panel, a table of contents inside the document with `[TOC]`, and `Alt`+`J` / `Alt`+`K` between files |
| **Search** | inside the open document, from two characters, with highlighting |
| **Print** | or save as PDF, with a stylesheet made for paper |
| **View** | light or dark theme, comfortable or compact line spacing |
| **Language** | English or Spanish, following the browser, with a button to switch |
| **Remember** | which files you loaded, which one you were reading and where you were in each |
| **Work** | offline, serverless, from a single file you can take anywhere |
| **Update** | on its own, without losing what you had open |

## How to open files

### From the app

There are three ways, all equivalent:

1. **Open folder** — pick a whole folder and it lists every `.md` inside it,
   including those in subfolders. This is the recommended option.
2. **Open individual files** — pick one or more specific files.
3. **Drag and drop** — drop the files onto the reading area.

On small screens the side panel is hidden; the **☰** button in the top bar
opens it.

### From another app, on your phone

In the chat or the file manager, tap the file's **share** icon and choose
**Lector MD** from the list.

> It's **share**, not *open with*. On Android, Chrome doesn't implement the API
> needed to appear in *open with*, so this is the way in.

## What Markdown it understands

Each example has two parts: the box with the text as it's written in the file
and, under **It looks like this**, the result.

### Text

~~~markdown
You can write *italics* with asterisks or _with underscores_, **bold**,
***bold and italics*** together, ~~strikethrough~~ and `inline code`.
~~~

It looks like this:

You can write *italics* with asterisks or _with underscores_, **bold**,
***bold and italics*** together, ~~strikethrough~~ and `inline code`.

Paragraphs are separated by a blank line. A single line break does **not**
end the paragraph: the lines are joined, as in classic Markdown. That's why
the two lines of the example show up as one.

### Quotes

~~~markdown
> A quote is a block of its own and can have **formatting inside**.
~~~

It looks like this:

> A quote is a block of its own and can have **formatting inside**.

### Separators

Three dashes alone on a line draw a horizontal rule:

~~~markdown
---
~~~

It looks like this:

---

### Headings

~~~markdown
# Document title
## Section
### Subsection
~~~

They go from `#` to `######`: the more hashes, the smaller the heading. There's
no separate result because the headings of this very document are written this
way; this one, for example, uses `###`.

Levels 1 to 3 build the **In this file** index in the side panel and the table
of contents explained next.

### Table of contents

~~~markdown
[TOC]
~~~

Write `[TOC]` alone on a line, wherever you want it to appear. The list of
level 1 to 3 headings is built there, with a link to each section. The result
is the **Contents** box at the top of this file.

If the document has a single `#`, it's taken as the title and not listed.
`[[_TOC_]]` works too, as in GitLab. Unlike the index in the side panel, the
table of contents is printed.

### Lists

~~~markdown
- An item
- Another item
  - Nested one level
  - Another nested one
- Back to the first level

1. First step
2. Second step
   1. Substep
   2. Another substep
3. Third step
~~~

It looks like this:

- An item
- Another item
  - Nested one level
  - Another nested one
- Back to the first level

1. First step
2. Second step
   1. Substep
   2. Another substep
3. Third step

Bullets accept `-`, `*` or `+`, and numbered items `1.` or `1)`.

### Tables

~~~markdown
| Element | Syntax | Shows in the index |
|---|---|---|
| Heading | `#` to `######` | levels 1 to 3 |
| Quote | greater-than sign | no |
| Formula | `$$` or a `math` fence | no |
~~~

It looks like this:

| Element | Syntax | Shows in the index |
|---|---|---|
| Heading | `#` to `######` | levels 1 to 3 |
| Quote | greater-than sign | no |
| Formula | `$$` or a `math` fence | no |

The row of dashes under the header is required. Wide tables scroll
horizontally on their own.

### Code

With fences of three backticks. If you put the language next to the opening
fence, keywords, strings, numbers and comments are highlighted:

~~~markdown
```python
def average(values):
    """Return the average, or None if the list is empty."""
    if not values:
        return None
    return sum(values) / len(values)
```
~~~

It looks like this:

```python
def average(values):
    """Return the average, or None if the list is empty."""
    if not values:
        return None
    return sum(values) / len(values)
```

These are the highlighted languages and how to write each one:

| Language | Next to the fence |
|---|---|
| JavaScript | `js`, `javascript`, `json` |
| TypeScript | `ts`, `typescript` |
| Python | `py`, `python` |
| HTML and XML | `html`, `xml`, `svg` |
| CSS | `css` |
| Java | `java` |
| C | `c`, `h` |
| C# | `cs`, `csharp`, `c#` |

The colors come from **Prism**, which weighs about 33 KB and is downloaded the
first time you open a file with code in one of these languages; after that it
stays cached. They follow the reader's theme and print with the light theme's
colors. Offline, or with any other language, the block looks the same but in a
single color.

A block indented with four spaces also works, and stays uncolored:

~~~markdown
    this is code too
    because it's indented
~~~

It looks like this:

    this is code too
    because it's indented

### Formulas

**Inline** formulas go between dollar signs, inside a sentence:

~~~markdown
The rest energy is $E = mc^2$.
~~~

It looks like this:

The rest energy is $E = mc^2$.

**Block** formulas go on their own line, between double dollar signs:

~~~markdown
$$\int_0^1 x^2\,dx = \frac{1}{3}$$
~~~

It looks like this:

$$\int_0^1 x^2\,dx = \frac{1}{3}$$

A fence with the language `math`, `latex` or `tex` works too, GitHub style:

~~~markdown
```math
\sum_{i=1}^{n} i = \frac{n(n+1)}{2}
```
~~~

It looks like this:

```math
\sum_{i=1}^{n} i = \frac{n(n+1)}{2}
```

When online they're drawn with **KaTeX**: real math typesetting. When not,
they fall back to a Unicode approximation that still reads well.

### Diagrams

A fence with the language `mermaid` is drawn as a diagram:

~~~markdown
```mermaid
flowchart LR
  W[WhatsApp] -->|share| SW[Service worker]
  SW --> C[(Cache)]
  C --> APP[Lector MD]
  APP --> IDB[(IndexedDB)]
```
~~~

It looks like this:

```mermaid
flowchart LR
  W[WhatsApp] -->|share| SW[Service worker]
  SW --> C[(Cache)]
  C --> APP[Lector MD]
  APP --> IDB[(IndexedDB)]
```

Every **Mermaid** type works: flowcharts, sequence, class, state, Gantt. For
example, a state diagram:

~~~markdown
```mermaid
stateDiagram-v2
  [*] --> Empty
  Empty --> Reading: open folder
  Reading --> Printing: PDF button
  Printing --> Reading
```
~~~

It looks like this:

```mermaid
stateDiagram-v2
  [*] --> Empty
  Empty --> Reading: open folder
  Reading --> Printing: PDF button
  Printing --> Reading
```

Diagrams follow the reader's theme, and are redrawn in light colors when
printing so they stay legible on paper.

When the window allows it, the drawing stretches past the text column. And if
it's still too small -a long Gantt, a chart with many bars- the **⤢** button in
the corner, or a click on the diagram, opens it full screen: wheel or pinch to
zoom, drag to move, `Esc` to go back.

The diagram library weighs about 3 MB, so **it's only downloaded when you open
a file that has a diagram**. After that it stays cached and works offline. If
it can't be downloaded, the block keeps showing the diagram's source, which
still reads fine.

### Charts

A fence with the language `chart` (or `grafico`) draws a bar, line, area,
scatter or pie chart. Options go first, one per line; then the data. The first
data row is the header: the first column holds the categories and each of the
following ones is a series.

~~~markdown
```chart
type: bar
title: Study hours per week
unit: h

Week, Calculus, Programming
1, 6, 4
2, 5, 7
3, 8, 6
4, 7, 9
```
~~~

It looks like this:

```chart
type: bar
title: Study hours per week
unit: h

Week, Calculus, Programming
1, 6, 4
2, 5, 7
3, 8, 6
4, 7, 9
```

A line chart is written the same way, with `type: line`:

~~~markdown
```chart
type: line
title: Response time under load
unit: ms

Users, Cached, Uncached
10, 12, 35
50, 14, 80
100, 15.5, 160
200, 18, 340
400, 25, 700
```
~~~

It looks like this:

```chart
type: line
title: Response time under load
unit: ms

Users, Cached, Uncached
10, 12, 35
50, 14, 80
100, 15.5, 160
200, 18, 340
400, 25, 700
```

An **area** chart is a line with the surface filled down to zero. It suits a
running total, where what you read is how much has piled up:

~~~markdown
```chart
type: area
title: Pages read this month
unit: pp.

Week, Read
1, 40
2, 95
3, 130
4, 210
```
~~~

It looks like this:

```chart
type: area
title: Pages read this month
unit: pp.

Week, Read
1, 40
2, 95
3, 130
4, 210
```

A **scatter** chart doesn't join the points. If the categories are numbers the
horizontal axis is numeric too and each point lands where it belongs, so a jump
in the data shows up as a gap instead of being spread out evenly:

~~~markdown
```chart
type: scatter
title: Grade by hours of study

Hours, Grade
2, 4
3, 5
5, 7
6, 6
9, 9
12, 10
```
~~~

It looks like this:

```chart
type: scatter
title: Grade by hours of study

Hours, Grade
2, 4
3, 5
5, 7
6, 6
9, 9
12, 10
```

A **pie** chart splits a total between its categories, with each slice's share
next to it. It takes a single value column, no negatives, and up to eight
slices:

~~~markdown
```chart
type: pie
title: Where the visits come from

Source, Visits
Search, 540
Direct, 260
Social, 150
Links, 50
```
~~~

It looks like this:

```chart
type: pie
title: Where the visits come from

Source, Visits
Search, 540
Direct, 260
Social, 150
Links, 50
```

| Option | What it does | If you leave it out |
|---|---|---|
| `type` | `bar`, `line`, `area`, `scatter` or `pie` | bar |
| `title` | text above the chart | no title |
| `unit` | text above the vertical axis and next to each value | nothing |
| `min`, `max` | a value the axis must include, such as `min: 0` | worked out automatically |

A few details:

- The options are also understood in Spanish: `tipo`, `titulo` and `unidad`,
  with `barras`, `lineas`, `area`, `dispersion` or `torta`.
- Columns are separated by commas. If your numbers use a **decimal comma**,
  separate the columns with semicolons instead.
- Tabs work too, which is what you get when copying cells from a spreadsheet,
  and so do vertical bars: a Markdown table pasted inside the fence works as is.
- An empty cell leaves a gap: the bar doesn't appear and the line breaks.
- Up to 8 series fit, one per color. With more, split the chart. A pie is
  capped at 8 slices, for the same reason.
- Bars and areas always start at zero, because what you read is the size; lines
  and points do so only when the data lands near it.
- Numbers go without thousands separators: `1234`, not `1,234`.

Hovering with the mouse, or tapping with a finger, shows the values for that
category, and on a pie the share as well. Below, **Show data** shows the same
information as a table. If the data has an error, the block keeps showing the
fence's text, with a note on what went wrong.

Unlike diagrams, charts are drawn by the reader itself, without downloading
anything: they work offline from the very first moment.

### Links and images

~~~markdown
A [regular link](https://mdreader.jhproyectos.com.ar), and a bare address
that turns into a link on its own: https://github.com/JHProyectos/mdreader-pwa
~~~

It looks like this:

A [regular link](https://mdreader.jhproyectos.com.ar), and a bare address
that turns into a link on its own: https://github.com/JHProyectos/mdreader-pwa

Images start with an exclamation mark, and the text in square brackets is the
alternative text. The illustration at the top is written like this:

~~~markdown
![A USB stick with a written page coming out of it](ejemplo-portada.png)
~~~

They shrink to fit the column. Note: an image with a relative path only shows
up if that path exists where you're opening the file. The reader receives the
text of the `.md`, not its folder.

Wiki-links are shown as code, not as links, because the reader has no way of
knowing which file they point to:

~~~markdown
See also [[another note]].
~~~

It looks like this:

See also [[another note]].

## File encoding

This is the part that usually causes the most trouble, so it pays to be
precise.

### File text

Files are **always read as UTF-8**. There's no automatic encoding detection
and no way to choose another one.

In practice you won't notice, because UTF-8 is what every editor uses today.
But if an old file was saved as *Latin-1* or *Windows-1252*, accented letters
will show up broken.

The fix is on the file's side, not the reader's: open it in any editor and save
it again as UTF-8.

### Line endings

It doesn't matter how they were saved. The reader normalizes all three styles:

| Style | Where it comes from |
|---|---|
| `LF` | Linux, macOS |
| `CRLF` | Windows |
| `CR` | classic Mac |

### Extensions

Three are accepted: `.md`, `.markdown` and `.txt`. When you open a folder, the
reader filters by those extensions and ignores everything else.

A `.txt` is processed as Markdown just like the others. If there's no Markdown
syntax inside, it simply shows as text.

## Reading, navigating, searching and printing

### Navigating

To move around a long document there are two indexes:

- **In this file**, in the side panel, lists the level 1 to 3 headings. Tap
  one and the document jumps to that section. It shows up when there are more
  than two headings; on a phone it's inside the panel that **☰** opens.
- **The table of contents** goes inside the document itself, wherever `[TOC]`
  is written. It's the **Contents** box at the top of this file, and its links
  also take you to each section. Unlike the panel, it's printed. How to write
  it is under *Table of contents*, above.

To go from one file to another, tap its name in the list or use `Alt` + `J`
for the next one and `Alt` + `K` for the previous one. Each file remembers how
far you read, so when you come back you're in the same place.

### Searching

The field at the top searches the open document and highlights the matches,
from two characters on. It doesn't search the other files in the list, only
the one you're reading.

Diagram text is left out of the search: a drawn diagram is a vector image, and
highlighting inside it would make the text disappear. For the same reason, in
charts the title, the legend and the **Show data** table (when open) are
searched, but not the axis numbers.

### Comfortable or compact

The **⇕** button in the panel switches between two reading densities. It
doesn't change the font size: it changes the spacing, meaning the line height
and the space between paragraphs, headings and blocks.

| | Comfortable | Compact |
|---|---|---|
| Line height | 1.6 | 1.38 |
| Between paragraphs | generous | minimal |
| Page margin | generous | tight |

**Comfortable** is the default and is meant for reading on screen without
getting tired. **Compact** tightens everything so more content fits at once:
it's useful for skimming a long document. The choice is remembered, so next
time it opens the way you left it.

**Printing is always compact**, whatever you use on screen. That's on purpose:
on paper, extra spacing turns into extra pages.

The **◐** button next to it does the same for the theme, between light and
dark, and also remembers your choice.

### Language

The interface and this help come in English and Spanish. By default the
browser's language is used; the **ES** button in the panel switches to
Spanish and, from there, **EN** switches back to English. The choice is
remembered.

The language doesn't touch your files: each document is shown exactly as it's
written.

### Printing or saving as PDF

The **⎙ PDF** button opens the browser's print dialog, which also lets you save
as PDF. There's a separate stylesheet for printing, so neither the side panel
nor the top bar end up on paper.

To number the pages, open *More settings* in the dialog and turn on *Headers
and footers*. The browser does that; it can't be requested from the document.
For the same reason, the table of contents is printed but without page
numbers.

### Shortcuts

| Shortcut | What it does |
|---|---|
| `Ctrl` + `F` | go to the search field |
| `Esc` | clear the search |
| `Alt` + `J` | next file |
| `Alt` + `K` | previous file |

### What gets remembered

The files you loaded, which one you were reading and how far along you were in
each: all of that is stored in your browser and comes back as it was next time,
even after an app update.

It's stored on your machine, not on a server. **Clear all** empties the
reader's list, and never deletes files from your disk.

## Asking an AI for a file that uses everything

If you want to try the reader with something of your own, the quickest way is
to ask ChatGPT, Claude or whichever you use to generate a `.md` that exercises
every feature. The problem with asking loosely is that models write
"GitHub-flavored" Markdown, with things this reader doesn't interpret, and the
result only half renders.

Copy this request, change the topic to whatever you want and paste it as is:

```
I need a sample Markdown file, in English, about CHANGE THIS TO YOUR TOPIC.

It must use everything below, because I'll open it in a reader that supports
exactly this syntax:

- Level 1 to 3 headings, at least five in total, so an index gets built
- A line with just [TOC] right after the title, for the table of contents
- Regular paragraphs with bold, italics, strikethrough and inline code
- A bulleted list with one level of nesting, and a numbered list
- A blockquote with something in bold inside
- A three-column table with a header
- A code block with its language declared, one of: js, ts, python, html, css, java, c or csharp
- An inline math formula and a block one, in LaTeX
- A Mermaid flowchart and a sequence diagram
- One chart of each kind, each in a fence with the language chart: first the lines "type: ..." (bar, line, area, scatter or pie) and "title: ...", then an empty line and the data separated by commas, with the first row as the header and the first column as the categories. The pie takes a single value column, all positive, and up to eight rows; on the scatter the categories should be numbers
- A horizontal rule

Don't use any of the following, because the reader doesn't interpret it and it
shows up as raw text: task lists with checkboxes, footnotes, raw HTML tags,
reference-style links with the definition at the end, or underlined headings
instead of headings with hashes.

Give it back to me as a single block of raw Markdown, ready to save as a UTF-8
.md file.
```

Save the answer as `test.md` and open it with **Open individual files**. If
something shows as raw text instead of rendered, the model almost certainly
slipped in one of the things from the list below.

## What it doesn't do

It's a deliberately small reader, with its own parser. These Markdown features
aren't there:

- **Task lists.** Checkboxes show up as text.
- **Footnotes.** They stay as written.
- **HTML inside Markdown.** It's shown as text, not interpreted. That's on
  purpose: files come from outside, and nothing they carry gets executed.
- **Reference-style links**, with the definition separately at the end.
- **Underlined headings**, the ones marked with dashes or equals signs under
  the text. Use `#`.
- **Editing.** It's a reader: it shows files, it doesn't change them.

---

If something here doesn't look the way you expected, the place to report it is
https://github.com/JHProyectos/mdreader-pwa

"use strict";

const DOCS = [];
let current = -1;
const REPOS_GITHUB = [];

const $ = id => document.getElementById(id);

const DB_NAME = "lector-md-datos";
const DB_VERSION = 1;
const DOC_STORE = "documentos";
const STATE_STORE = "estado";
const STATE_KEY = "workspace";

const scrollPorRuta = Object.create(null);
let restaurandoWorkspace = false;
let avisoPersistenciaMostrado = false;
let guardadoEstadoT = null;
let workspaceReady = Promise.resolve();

function abrirBaseDeDatos(){
  return new Promise((resolve, reject) => {
    if(!("indexedDB" in window)){
      reject(new Error("IndexedDB no está disponible en este navegador."));
      return;
    }

    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(DOC_STORE)){
        db.createObjectStore(DOC_STORE, {keyPath:"path"});
      }
      if(!db.objectStoreNames.contains(STATE_STORE)){
        db.createObjectStore(STATE_STORE, {keyPath:"key"});
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error("No se pudo abrir IndexedDB."));
    req.onblocked = () => reject(new Error("La base local está bloqueada por otra ventana."));
  });
}

const DB_READY = abrirBaseDeDatos();

DB_READY.catch(() => {});

function avisarErrorPersistencia(error){
  console.error("No se pudo guardar el área de trabajo:", error);
  if(avisoPersistenciaMostrado || !DOCS.length) return;
  avisoPersistenciaMostrado = true;
  alert(t("alertPersistencia"));
}

function esperarTransaccion(tx){
  return new Promise((resolve, reject) => {
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error || new Error("Falló la operación local."));
    tx.onabort = () => reject(tx.error || new Error("Se canceló la operación local."));
  });
}

function leerWorkspacePersistido(){
  return DB_READY.then(db => new Promise((resolve, reject) => {
    const tx = db.transaction([DOC_STORE, STATE_STORE], "readonly");
    const docsReq = tx.objectStore(DOC_STORE).getAll();
    const stateReq = tx.objectStore(STATE_STORE).get(STATE_KEY);

    tx.oncomplete = () => resolve({
      docs: Array.isArray(docsReq.result) ? docsReq.result : [],
      state: stateReq.result || null
    });
    tx.onerror = () => reject(tx.error || new Error("No se pudo leer la sesión local."));
    tx.onabort = () => reject(tx.error || new Error("Se canceló la lectura local."));
  }));
}

async function guardarDocumentosPersistidos(documentos){
  if(!documentos.length) return true;
  try{
    const db = await DB_READY;
    const tx = db.transaction(DOC_STORE, "readwrite");

    documentos.forEach(d => store.put({name:d.name, path:d.path, text:d.text}));
    await esperarTransaccion(tx);

    return false;
  }
}

  try{

    const tx = db.transaction(STATE_STORE, "readwrite");
    tx.objectStore(STATE_STORE).put(crearEstadoPersistible());

async function vaciarWorkspacePersistido(){

    const tx = db.transaction([DOC_STORE, STATE_STORE], "readwrite");

async function guardarWorkspaceCompleto(){
  try{
    const db = await DB_READY;
    const tx = db.transaction([DOC_STORE, STATE_STORE], "readwrite");
    const docsStore = tx.objectStore(DOC_STORE);
    docsStore.clear();
    DOCS.forEach(d => docsStore.put({name:d.name, path:d.path, text:d.text}));
    tx.objectStore(STATE_STORE).put(crearEstadoPersistible());
    await esperarTransaccion(tx);
    return true;

    avisarErrorPersistencia(error);
    return false;
  }
}

async function restaurarWorkspace(){
  restaurandoWorkspace = true;
  try{
    const {docs, state} = await leerWorkspacePersistido();
    const validos = docs.filter(d =>
      d && typeof d.name === "string" && typeof d.path === "string" &&
      typeof d.text === "string"
    );
    if(validos.length){
      DOCS.splice(0, DOCS.length, ...validos);
      DOCS.sort((a,b)=>{
        const w = p => p.includes("/") ? 1 : 0;
        return w(a.path) - w(b.path) || a.path.localeCompare(b.path,"es");
      });

      if(state && state.scrollPorRuta && typeof state.scrollPorRuta === "object"){
        DOCS.forEach(d => {
          const valor = Number(state.scrollPorRuta[d.path]);
          if(Number.isFinite(valor) && valor >= 0) scrollPorRuta[d.path] = valor;
        });
      }

      if(Array.isArray(state && state.reposGithub)){
        REPOS_GITHUB.splice(0, REPOS_GITHUB.length, ...state.reposGithub.filter(r =>

          typeof r.rama === "string" && typeof r.prefijo === "string"
        ));
        $("ghActualizar").hidden = !REPOS_GITHUB.length;
      }

      const recordado = state && typeof state.currentPath === "string"

      open(recordado >= 0 ? recordado : 0, {
        guardarAnterior:false,
        persistir:false
      });

  }catch(error){

  }finally{
    restaurandoWorkspace = false;
  }

  if(navigator.storage && navigator.storage.persist){
    navigator.storage.persist().catch(() => {});
  }
}

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

const SYM = {
  alpha:"α", beta:"β", gamma:"γ", Gamma:"Γ", delta:"δ", Delta:"Δ",
  epsilon:"ε", varepsilon:"ε", zeta:"ζ", eta:"η", theta:"θ", Theta:"Θ",
  iota:"ι", kappa:"κ", lambda:"λ", Lambda:"Λ", mu:"μ", nu:"ν", xi:"ξ",
  pi:"π", Pi:"Π", rho:"ρ", sigma:"σ", Sigma:"Σ", tau:"τ", upsilon:"υ",
  phi:"φ", varphi:"φ", Phi:"Φ", chi:"χ", psi:"ψ", Psi:"Ψ", omega:"ω", Omega:"Ω",
  infty:"∞", partial:"∂", nabla:"∇", int:"∫", iint:"∬", oint:"∮",
  sum:"Σ", prod:"Π", pm:"±", mp:"∓", times:"×", div:"÷", cdot:"·", ast:"∗",
  leq:"≤", le:"≤", geq:"≥", ge:"≥", neq:"≠", ne:"≠", approx:"≈", equiv:"≡",
  sim:"∼", propto:"∝", in:"∈", notin:"∉", subset:"⊂", cup:"∪", cap:"∩",
  to:"→", rightarrow:"→", leftarrow:"←", Rightarrow:"⟹", Leftarrow:"⟸",
  leftrightarrow:"↔", Leftrightarrow:"⟺", mapsto:"↦", forall:"∀", exists:"∃",
  angle:"∠", perp:"⊥", parallel:"∥", degree:"°", prime:"′", ldots:"…", dots:"…",
  cdots:"⋯", vdots:"⋮", Re:"ℜ", Im:"ℑ", ell:"ℓ", hbar:"ℏ", emptyset:"∅",
  lim:"lim", log:"log", ln:"ln", exp:"exp", sin:"sin", cos:"cos", tan:"tan",
  arctan:"arctan", arcsin:"arcsin", arccos:"arccos", sinh:"sinh", cosh:"cosh",
  max:"max", min:"min", det:"det", deg:"deg"
};

function mathify(src){
  let s = esc(src);

  s = s.replace(/\\(left|right|big|Big|bigg|Bigg|displaystyle|limits|!|,|;|:|\s)/g," ");
  s = s.replace(/\\begin\{(cases|aligned|align\*?|array)\}(\{[^}]*\})?/g,"");
  s = s.replace(/\\end\{(cases|aligned|align\*?|array)\}/g,"");
  s = s.replace(/\\\\/g," ; ");
  s = s.replace(/&amp;/g," ");

  for(let i=0;i<2;i++){
    s = s.replace(/\\frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,
        '<span class="frac"><span class="num">$1</span><span class="den">$2</span></span>');
    s = s.replace(/\\d?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,
        '<span class="frac"><span class="num">$1</span><span class="den">$2</span></span>');
    s = s.replace(/\\sqrt\s*\{([^{}]*)\}/g,'√<span class="root">$1</span>');
    s = s.replace(/\\boxed\s*\{([^{}]*)\}/g,'<span class="boxed">$1</span>');
    s = s.replace(/\\(?:mathcal|mathbb|mathrm|mathbf|text|operatorname)\s*\{([^{}]*)\}/g, (m,g)=>{
      if(g==="L") return "ℒ";
      if(g==="F") return "ℱ";
      if(g==="Z") return "ℤ";
      if(g==="R") return "ℝ";
      return g;
    });
  }

  s = s.replace(/\^\s*\{([^{}]*)\}/g,"<sup>$1</sup>");
  s = s.replace(/_\s*\{([^{}]*)\}/g,"<sub>$1</sub>");
  s = s.replace(/\^(-?[0-9a-zA-Z])/g,"<sup>$1</sup>");
  s = s.replace(/_(-?[0-9a-zA-Z])/g,"<sub>$1</sub>");

  s = s.replace(/\\([A-Za-z]+)/g, (m,name)=> SYM[name] !== undefined ? SYM[name] : name);

  s = s.replace(/[{}]/g,"");
  return s;
}

const unesc = s => s.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&");

let KATEX = false;

function renderMath(tex, display){
  if(KATEX && window.katex){
    try{
      const html = katex.renderToString(tex, {
        displayMode: display, throwOnError: false, strict: false,
        trust: false, output: "html"
      });
      return display ? '<div class="mathblock katex-on">'+html+'</div>' : html;
    }catch(e){  }
  }
  return display
    ? '<div class="mathblock">'+mathify(tex)+'</div>'
    : '<span class="mathinline">'+mathify(tex)+'</span>';
}
