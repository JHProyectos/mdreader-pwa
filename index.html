function inline(t){
  let s = esc(t);

  const code = [];
  s = s.replace(/`([^`]+)`/g, (m,g)=>{ code.push(g); return ""+(code.length-1)+""; });
  s = s.replace(/&lt;br\s*\/?&gt;/gi, "<br>");

  const math = [];
  const keep = g => "" + (math.push(unesc(g)) - 1) + "";
  s = s.replace(/\\\((.+?)\\\)/g, (m,g)=>keep(g));
  s = s.replace(/(^|[^$\\])\$([^$\n]+)\$/g, (m,pre,g)=>pre+keep(g));

  s = s.replace(/\*\*\*(.+?)\*\*\*/g,"<strong><em>$1</em></strong>");
  s = s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  s = s.replace(/(^|[^_\w])_([^_\n]+)_/g,"$1<em>$2</em>");
  s = s.replace(/~~(.+?)~~/g,"<del>$1</del>");

  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img src="$2" alt="$1">');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(^|\s)(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');

  s = s.replace(/\[\[([^\]]+)\]\]/g,'<code>$1</code>');

  s = s.replace(/(\d+)/g,(m,i)=>renderMath(math[+i], false));

  s = s.replace(/(\d+)/g,(m,i)=>"<code>"+code[+i]+"</code>");
  return s;
}

let hCount = 0;
function slug(t,i){ return "h"+i+"-"+t.toLowerCase().replace(/[^a-z0-9áéíóúñü]+/g,"-").slice(0,40); }

function render(md){
  const L = md.replace(/\r\n?/g,"\n").split("\n");
  const out = [];
  const heads = [];

  let i = 0;

  const flushPara = buf => { if(buf.length){ out.push("<p>"+inline(buf.join(" "))+"</p>"); buf.length = 0; } };
  let para = [];

  while(i < L.length){
    const ln = L[i];

    const fence = ln.match(/^\s*(```+|~~~+)\s*([\w+#.-]*)\s*$/);
    if(fence){
      flushPara(para);
      const mark = fence[1][0].repeat(3);
      const body = [];
      i++;
      while(i < L.length && !new RegExp("^\\s*"+mark).test(L[i])){ body.push(L[i]); i++; }
      i++;
      const lang = fence[2] || "";

      if(/^(math|latex|tex)$/i.test(lang)){
        out.push(renderMath(body.join(" "), true));
      } else if(/^mermaid$/i.test(lang)){
        out.push(renderDiagram(body.join("\n")));
      } else if(/^(grafico|chart)$/i.test(lang)){
        out.push(renderGrafico(body.join("\n")));
      } else {
        out.push(renderCodigo(body.join("\n"), lang));
      }
      continue;
    }

    if(/^\s*(\[toc\]|\[\[_toc_\]\])\s*$/i.test(ln)){
      flushPara(para);
      out.push(MARCA_INDICE);
      i++; continue;
    }

    if(/^\s*(\\\[|\$\$)\s*$/.test(ln)){
      flushPara(para);
      const close = ln.includes("$$") ? /\$\$/ : /\\\]/;
      const body = [];
      i++;
      while(i < L.length && !close.test(L[i])){ body.push(L[i]); i++; }
      i++;
      out.push(renderMath(body.join(" "), true));
      continue;
    }

    const one = ln.match(/^\s*\\\[(.+?)\\\]\s*$/) || ln.match(/^\s*\$\$(.+?)\$\$\s*$/);
    if(one){
      flushPara(para);
      out.push(renderMath(one[1], true));
      i++; continue;
    }

    if(/^ {4}\S/.test(ln) && !para.length){
      flushPara(para);
      const body = [];
      while(i < L.length && (/^ {4}/.test(L[i]) || L[i].trim()==="")){
        if(L[i].trim()==="" && !/^ {4}/.test(L[i+1]||"")) break;
        body.push(L[i].replace(/^ {4}/,""));
        i++;
      }
      out.push("<pre><code>"+esc(body.join("\n"))+"</code></pre>");
      continue;
    }

    if(/^\s*\|.*\|\s*$/.test(ln) && /^\s*\|[\s:|-]+\|\s*$/.test(L[i+1]||"")){
      flushPara(para);
      const cells = r => r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const head = cells(ln);
      i += 2;
      const rows = [];
      while(i < L.length && /^\s*\|.*\|\s*$/.test(L[i])){ rows.push(cells(L[i])); i++; }
      let t = '<div class="tablewrap"><table><thead><tr>';
      head.forEach(c => t += "<th>"+inline(c)+"</th>");
      t += "</tr></thead><tbody>";
      rows.forEach(r=>{
        t += "<tr>";
        for(let k=0;k<head.length;k++) t += "<td>"+inline(r[k]||"")+"</td>";
        t += "</tr>";
      });
      out.push(t+"</tbody></table></div>");
      continue;
    }

    const h = ln.match(/^(#{1,6})\s+(.*)$/);
    if(h){
      flushPara(para);
      const lv = h[1].length;
      const txt = h[2].replace(/\s*#+\s*$/,"");
      const id = slug(txt, ++hCount);
      if(lv <= 3) heads.push({lv, txt, id});
      out.push("<h"+lv+' id="'+id+'">'+inline(txt)+"</h"+lv+">");
      i++; continue;
    }

    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(ln)){
      flushPara(para); out.push("<hr>"); i++; continue;
    }

    if(/^\s*>/.test(ln)){
      flushPara(para);
      const body = [];
      while(i < L.length && /^\s*>/.test(L[i])){ body.push(L[i].replace(/^\s*>\s?/,"")); i++; }
      out.push("<blockquote>"+render(body.join("\n")).html+"</blockquote>");
      continue;
    }

    if(/^\s*([-*+]|\d+[.)])\s+/.test(ln)){
      flushPara(para);
      const ord = /^\s*\d+[.)]\s+/.test(ln);
      const items = [];
      let baseIndent = ln.match(/^\s*/)[0].length;
      while(i < L.length && /^\s*([-*+]|\d+[.)])\s+/.test(L[i])){
        const ind = L[i].match(/^\s*/)[0].length;
        if(ind < baseIndent) break;
        let txt = L[i].replace(/^\s*([-*+]|\d+[.)])\s+/,"");
        i++;

        const cont = [];
        while(i < L.length && L[i].trim() !== "" && !/^\s*([-*+]|\d+[.)])\s+/.test(L[i])
              && L[i].match(/^\s*/)[0].length > ind){
          cont.push(L[i].trim()); i++;
        }

        const sub = [];
        while(i < L.length && /^\s*([-*+]|\d+[.)])\s+/.test(L[i])
              && L[i].match(/^\s*/)[0].length > ind){
          sub.push(L[i]); i++;
        }
        let html = inline([txt, ...cont].join(" "));
        if(sub.length) html += render(sub.map(s=>s.replace(/^\s{0,3}/,"")).join("\n")).html;
        items.push("<li>"+html+"</li>");
      }
      out.push((ord?"<ol>":"<ul>")+items.join("")+(ord?"</ol>":"</ul>"));
      continue;
    }

    if(ln.trim() === ""){ flushPara(para); i++; continue; }
    para.push(ln.trim());
    i++;
  }
  flushPara(para);
  let html = out.join("\n");
  if(html.includes(MARCA_INDICE)) html = html.split(MARCA_INDICE).join(indiceHTML(heads));
  return {html, heads};
}

const MARCA_INDICE = "<!--indice-->";

function indiceHTML(heads){

  const lista = heads.filter(h => h.lv === 1).length === 1
    ? heads.filter(h => h.lv > 1)
    : heads;
  if(!lista.length) return "";

  const base = Math.min(...lista.map(h => h.lv));
  let html = '<nav class="doctoc" aria-label="'+t("indiceAria")+'"><p class="doctoc-t">'
           + t("indiceTitulo")+'</p><ol>';
  let prof = -1;
  for(const h of lista){

    const nivel = Math.min(h.lv - base, prof + 1);
    if(prof < 0){  }
    else if(nivel > prof) html += "<ol>";
    else {
      html += "</li>";
      for(let k = prof; k > nivel; k--) html += "</ol></li>";
    }
    prof = nivel;
    html += '<li><a href="#'+h.id+'">'+esc(h.txt)+"</a>";
  }
  html += "</li>";
  for(let k = prof; k > 0; k--) html += "</ol></li>";
  return html + "</ol></nav>";
}

const MERMAID_VER = "11.15.0";
let MERMAID = false;
let mmdCarga = null;
let mmdSeq = 0;
let mmdClaro = null;
let generacionDoc = 0;

const KATEX_VER = "0.16.9";
let estadoKatex = "espera";
let estadoMermaid = "espera";

function pintarEstados(){
  const math = $("mathInfo"), diag = $("diagInfo");
  const txtMath = t("katexSum", estadoKatex, KATEX_VER);
  const txtDiag = t("mmdSum", estadoMermaid, MERMAID_VER);

  math.title = txtMath;

function esTemaOscuro(){
  const tema = document.documentElement.getAttribute("data-theme");
  return tema === "dark" ||
    (!tema && matchMedia("(prefers-color-scheme:dark)").matches);
}

function asegurarMermaid(){
  if(mmdCarga) return mmdCarga;

  estadoMermaid = "cargando";
  pintarEstados();

  mmdCarga = new Promise(resolve => {
    const js = document.createElement("script");
    js.src = "https://cdnjs.cloudflare.com/ajax/libs/mermaid/" + MERMAID_VER + "/mermaid.min.js";

    const fallo = () => {
      js.remove();
      estadoMermaid = "off";
      pintarEstados();
      resolve(false);
    };

    js.onload = () => {
      if(!window.mermaid){ fallo(); return; }
      MERMAID = true;
      estadoMermaid = "on";
      pintarEstados();
      resolve(true);
    };
    js.onerror = fallo;

    document.head.appendChild(js);
  });

  return mmdCarga;
}

function configurarMermaid(claro){
  if(mmdClaro === claro) return;
  const css = getComputedStyle(document.body);

  const forzado = claro !== !esTemaOscuro();
  const fondo = forzado ? "#ffffff" : (css.getPropertyValue("--surface").trim() || "#ffffff");

  mermaid.initialize({
    startOnLoad: false,

    securityLevel: "strict",

    suppressErrorRendering: true,
    theme: claro ? "default" : "dark",
    themeVariables: {
      fontFamily: css.fontFamily,
      fontSize: "14px",
      edgeLabelBackground: fondo
    }
  });
  mmdClaro = claro;
}

function marcarDiagramaConError(bloque, error){
  const fuente = bloque.querySelector(".diagram-src");
  if(fuente) fuente.hidden = false;
  bloque.dataset.diagram = "error";
  if(bloque.querySelector(".diagram-err")) return;

  const detalle = String((error && error.message) || error || "").split("\n")[0].trim();
  const nota = document.createElement("p");
  nota.className = "diagram-err";
  nota.textContent = t("diagramaError", detalle);
  bloque.appendChild(nota);
}

async function pintarDiagramas(opciones = {}){
  const pendientes = () => [...$("doc").querySelectorAll('.diagram[data-diagram="pendiente"]')];
  if(!pendientes().length) return;

  const gen = generacionDoc;
  if(!MERMAID){
    const listo = await asegurarMermaid();

    if(!listo){ mmdCarga = null; return; }
    if(gen !== generacionDoc) return;
  }

  configurarMermaid(opciones.claro === true || !esTemaOscuro());

  for(const bloque of pendientes()){
    const fuente = bloque.querySelector(".diagram-src");
    if(!fuente) continue;
    try{
      const {svg} = await mermaid.render("mmd-" + (++mmdSeq), fuente.textContent);
      if(gen !== generacionDoc || !bloque.isConnected) return;
      const caja = document.createElement("div");
      caja.className = "diagram-svg";
      caja.innerHTML = svg;
      bloque.appendChild(caja);
      fuente.hidden = true;
      bloque.dataset.diagram = "listo";
      agregarBotonAmpliar(bloque);
    }catch(error){
      if(gen !== generacionDoc || !bloque.isConnected) return;
      marcarDiagramaConError(bloque, error);
    }
  }
}

function reiniciarDiagramas(){
  $("doc").querySelectorAll(".diagram").forEach(bloque => {
    const svg = bloque.querySelector(".diagram-svg");
    if(svg) svg.remove();
    const nota = bloque.querySelector(".diagram-err");
    if(nota) nota.remove();
    const fuente = bloque.querySelector(".diagram-src");
    if(fuente) fuente.hidden = false;
    const boton = bloque.querySelector(":scope > .ampliar");
    if(boton) boton.remove();
    bloque.dataset.diagram = "pendiente";
  });
}

function redibujarDiagramas(){
  if(!MERMAID) return;
  cerrarZoom();
  reiniciarDiagramas();
  void pintarDiagramas();
}

const PRISM_VER = "1.30.0";
let PRISM = false;
let prismCarga = null;

function cargarScript(src){
  return new Promise((resolve, reject) => {
    const js = document.createElement("script");
    js.src = src;
    js.onload = () => resolve();
    js.onerror = () => { js.remove(); reject(new Error("No se pudo cargar " + src)); };
    document.head.appendChild(js);
  });
}

function asegurarPrism(){
  if(prismCarga) return prismCarga;
  const BASE = "https://cdnjs.cloudflare.com/ajax/libs/prism/" + PRISM_VER + "/";

  window.Prism = window.Prism || {};
  window.Prism.manual = true;

  prismCarga = cargarScript(BASE + "prism.min.js")
    .then(() => Promise.all(["typescript", "python", "java", "c", "csharp"]
      .map(l => cargarScript(BASE + "components/prism-" + l + ".min.js"))))
    .then(() => (PRISM = !!(window.Prism && Prism.highlight)))
    .catch(() => { prismCarga = null; return false; });
  return prismCarga;
}

async function pintarCodigo(){
  const pendientes = () => [...$("doc").querySelectorAll("pre[data-lang]:not([data-resaltado])")];
  if(!pendientes().length) return;

  if(!PRISM){
    const gen = generacionDoc;
    if(!await asegurarPrism() || gen !== generacionDoc) return;
  }

  for(const pre of pendientes()){
    const code = pre.firstElementChild;
    const lang = pre.dataset.lang;
    const gramatica = Prism.languages[lang];
    if(!code || !gramatica) continue;

    code.innerHTML = Prism.highlight(code.textContent, gramatica, lang);
    pre.dataset.resaltado = "";
  }
}

const SVG_NS = "http://www.w3.org/2000/svg";
const GRAF_MAX_SERIES = 8;
const GRAF_ALTO = 220;
const GRAF_CARACTER = 6.4;

const NOMBRE_GRAFICO = {
  barras:"graficoBarras", lineas:"graficoLineas", area:"graficoArea",
  dispersion:"graficoDispersion", torta:"graficoTorta"
};

const GRAF_CLAVES = {
  tipo:"tipo", type:"tipo",
  titulo:"titulo", "título":"titulo", title:"titulo",
  unidad:"unidad", unit:"unidad",
  min:"min", max:"max"
};

const redondo = v => Math.round(v * 10) / 10;

function localeNumeros(){
  const nav = navigator.language || "";
  return nav.toLowerCase().startsWith(IDIOMA) ? nav : (IDIOMA === "es" ? "es-AR" : "en-US");
}
const fmtNumero = (v, decimales = 6) =>
  v === null ? "—" : v.toLocaleString(localeNumeros(), {maximumFractionDigits: decimales});

function leerNumero(txt){
  let s = String(txt || "").replace(/\s/g, "").replace(/%$/, "");
  if(s === "" || s === "-") return null;
  if(s.includes(",") && s.includes(".")){

    s = s.lastIndexOf(",") > s.lastIndexOf(".")
      ? s.replace(/\./g, "").replace(",", ".")
      : s.replace(/,/g, "");
  } else {
    s = s.replace(",", ".");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN;
}

function leerGrafico(src){
  const g = {tipo:"barras", titulo:"", unidad:"", min:null, max:null};
  const filas = [];
  let sep = null;

  for(const crudo of src.split("\n")){
    const ln = crudo.trim();
    if(!ln) continue;

    if(!filas.length){
      const op = ln.match(/^([a-záéíóú]+)\s*:\s*(.*)$/i);
      const clave = op && GRAF_CLAVES[op[1].toLowerCase()];
      if(clave){ g[clave] = op[2].trim(); continue; }
    }

    if(/^\|?[\s:|-]+\|?$/.test(ln) && ln.includes("-")) continue;

    let fila = crudo.replace(/^ +| +$/g, "");
    if(sep === null){
      sep = fila.includes("\t") ? "\t" : fila.includes("|") ? "|" : fila.includes(";") ? ";" : ",";
    }
    if(sep === "|") fila = fila.trim().replace(/^\|/, "").replace(/\|$/, "");
    filas.push(fila.split(sep).map(c => c.trim()));
  }

  const tipo = String(g.tipo).toLowerCase();
  if(/^(barras?|columnas?|bars?|columns?)$/.test(tipo)) g.tipo = "barras";
  else if(/^(l[ií]neas?|lines?)$/.test(tipo)) g.tipo = "lineas";
  else if(/^[áa]reas?$/.test(tipo)) g.tipo = "area";
  else if(/^(dispersi[óo]n|puntos?|scatter|points?)$/.test(tipo)) g.tipo = "dispersion";
  else if(/^(torta|tarta|pastel|circular|pie|donut)$/.test(tipo)) g.tipo = "torta";
  else throw new Error(t("errTipo", g.tipo));

  for(const k of ["min", "max"]){
    if(g[k] === null || g[k] === ""){ g[k] = null; continue; }
    const n = leerNumero(g[k]);
    if(n === null || Number.isNaN(n)) throw new Error(t("errMinMax", k, g[k]));
    g[k] = n;
  }

  if(filas.length < 2) throw new Error(t("errFaltanDatos"));
  const [encabezado, ...resto] = filas;
  g.ejeX = encabezado[0] || "";
  g.series = encabezado.slice(1).map((s, k) => s || t("serie", k + 1));
  if(!g.series.length) throw new Error(t("errSinSeries"));
  if(g.series.length > GRAF_MAX_SERIES){
    throw new Error(t("errMuchasSeries", g.series.length, GRAF_MAX_SERIES));
  }

  g.categorias = resto.map(f => f[0] || "");
  g.valores = resto.map((f, r) => g.series.map((nombre, k) => {
    const n = leerNumero(f[k + 1]);
    if(Number.isNaN(n)) throw new Error(t("errNoNumero", f[k + 1], r + 1, nombre));
    return n;
  }));
  if(!g.valores.some(f => f.some(v => v !== null))) throw new Error(t("errSinValores"));

  if(g.tipo === "torta"){
    if(g.series.length > 1) throw new Error(t("errTortaSeries", g.series.length));
    if(g.categorias.length > GRAF_MAX_SERIES){
      throw new Error(t("errMuchasPorciones", g.categorias.length, GRAF_MAX_SERIES));
    }
    if(g.valores.some(f => f[0] < 0)) throw new Error(t("errTortaNegativo"));
    g.total = g.valores.reduce((a, f) => a + (f[0] || 0), 0);
    if(!g.total) throw new Error(t("errTortaCero"));
  }

  if(g.tipo === "dispersion"){
    const xs = g.categorias.map(c => leerNumero(c));
    g.equis = xs.every(v => v !== null && !Number.isNaN(v)) ? xs : null;
  }

  return g;
}

function escalaLinda(lo, hi){
  if(lo === hi){ const d = Math.abs(lo) / 2 || 1; lo -= d; hi += d; }
  const bruto = (hi - lo) / 5;
  const mag = Math.pow(10, Math.floor(Math.log10(bruto)));
  const r = bruto / mag;
  const paso = (r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10) * mag;
  const ini = Math.floor(lo / paso + 1e-9) * paso;
  const fin = Math.ceil(hi / paso - 1e-9) * paso;
  const ticks = [];
  for(let k = 0; ini + k * paso <= fin + paso / 2; k++) ticks.push(+(ini + k * paso).toPrecision(12));
  return {lo: ini, hi: fin, paso, ticks};
}

function svgNodo(tag, attrs, padre){
  const n = document.createElementNS(SVG_NS, tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  if(padre) padre.appendChild(n);
  return n;
}

function caminoBarra(x, w, yBase, yPunta){
  const r = Math.min(4, w / 2, Math.abs(yBase - yPunta));
  const s = yPunta < yBase ? 1 : -1;
  const [a, b, c, d] = [x, x + r, x + w - r, x + w].map(redondo);
  const [yb, yp, yr] = [yBase, yPunta, yPunta + s * r].map(redondo);
  return `M${a},${yb}V${yr}Q${a},${yp} ${b},${yp}H${c}Q${d},${yp} ${d},${yr}V${yb}Z`;
}

function caminoPorcion(cx, cy, r, a0, a1){
  const p = a => [redondo(cx + r * Math.cos(a)), redondo(cy + r * Math.sin(a))];

  if(a1 - a0 >= Math.PI * 2 - 1e-9){
    const [ix, iy] = p(a0), [dx, dy] = p(a0 + Math.PI);
    return `M${ix},${iy}A${r},${r} 0 1 1 ${dx},${dy}A${r},${r} 0 1 1 ${ix},${iy}Z`;
  }
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M${redondo(cx)},${redondo(cy)}L${x0},${y0}` +
         `A${r},${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1},${y1}Z`;
}

function crearTip(lienzo){
  const tip = document.createElement("div");
  tip.className = "chart-tip";
  tip.hidden = true;
  lienzo.appendChild(tip);
  return tip;
}

function ubicarTip(tip, lienzo, e){
  const caja = lienzo.getBoundingClientRect();
  const px = e.clientX - caja.left, py = e.clientY - caja.top;
  let left = px + 14;
  if(left + tip.offsetWidth > caja.width) left = px - 14 - tip.offsetWidth;
  tip.style.left = Math.max(0, left) + "px";
  tip.style.top = Math.max(0, Math.min(py - tip.offsetHeight / 2, caja.height - tip.offsetHeight)) + "px";
}

function filaTip(clase, valor, nombre){
  const fila = document.createElement("div");
  fila.className = "fila";
  const clave = document.createElement("i");
  clave.className = clase;
  const v = document.createElement("b");
  v.textContent = valor;
  const n = document.createElement("span");
  n.textContent = nombre;
  fila.append(clave, v, n);
  return fila;
}

function dibujarLienzo(lienzo, g){
  const ancho = Math.round(lienzo.clientWidth);
  if(ancho < 120) return;
  lienzo.dataset.ancho = ancho;
  lienzo.textContent = "";
  if(g.tipo === "torta") dibujarTorta(lienzo, g, ancho);
  else dibujarCartesiano(lienzo, g, ancho);
}

function dibujarCartesiano(lienzo, g, ancho){
  const esBarras = g.tipo === "barras";
  const esArea = g.tipo === "area";
  const esDisp = g.tipo === "dispersion";
  const traza = g.tipo === "lineas" || esArea;

  const todos = g.valores.flat().filter(v => v !== null);
  let lo = Math.min(...todos), hi = Math.max(...todos);
  if(esBarras || esArea){ lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  else if(lo >= 0 && lo <= hi / 2) lo = 0;
  else if(hi <= 0 && hi >= lo / 2) hi = 0;
  if(g.min !== null) lo = Math.min(lo, g.min);
  if(g.max !== null) hi = Math.max(hi, g.max);
  const escala = escalaLinda(lo, hi);
  const decimales = (String(+escala.paso.toPrecision(6)).split(".")[1] || "").length;
  const etiquetasY = escala.ticks.map(t => fmtNumero(t, decimales));

  const izq = Math.ceil(Math.max(...etiquetasY.map(t => t.length)) * GRAF_CARACTER) + 10;
  const der = 12, arriba = g.unidad ? 24 : 10, abajo = 26;
  const alto = arriba + GRAF_ALTO + abajo;
  const x0 = izq, x1 = ancho - der, y0 = arriba, y1 = arriba + GRAF_ALTO;
  const yDe = v => y1 - (v - escala.lo) / (escala.hi - escala.lo) * GRAF_ALTO;

  const svg = svgNodo("svg", {
    viewBox: "0 0 " + ancho + " " + alto, width: ancho, height: alto, role: "img",
    "aria-label": g.titulo || t(NOMBRE_GRAFICO[g.tipo])
  }, lienzo);

  const ejes = svgNodo("g", {}, svg);
  const hayCero = escala.ticks.includes(0);
  escala.ticks.forEach((t, k) => {
    const y = Math.round(yDe(t)) + .5;
    svgNodo("line", {x1: x0, x2: x1, y1: y, y2: y, class: t === 0 || (!hayCero && k === 0) ? "base" : "grid"}, ejes);
    svgNodo("text", {x: x0 - 8, y, dy: "0.32em", "text-anchor": "end"}, ejes).textContent = etiquetasY[k];
  });
  if(g.unidad) svgNodo("text", {x: 0, y: 11}, ejes).textContent = g.unidad;

  const n = g.categorias.length;
  const banda = (x1 - x0) / n;
  const hueco = esBarras ? banda : (n === 1 ? x1 - x0 : (x1 - x0 - 16) / (n - 1));
  const escalaX = esDisp && g.equis ? escalaLinda(Math.min(...g.equis), Math.max(...g.equis)) : null;
  const xDe = escalaX
    ? i => x0 + (g.equis[i] - escalaX.lo) / (escalaX.hi - escalaX.lo) * (x1 - x0)
    : esBarras
      ? i => x0 + banda * (i + .5)
      : i => n === 1 ? (x0 + x1) / 2 : x0 + 8 + i * hueco;

  const recorte = t => t.length > 16 ? t.slice(0, 15) + "…" : t;
  const rotular = (txt, x) => {
    const w = txt.length * GRAF_CARACTER;
    const px = Math.min(Math.max(x, w / 2), ancho - w / 2);
    svgNodo("text", {x: redondo(px), y: y1 + 17, "text-anchor": "middle"}, ejes).textContent = txt;
  };
  if(escalaX){

    const decX = (String(+escalaX.paso.toPrecision(6)).split(".")[1] || "").length;
    const etqX = escalaX.ticks.map(v => fmtNumero(v, decX));
    const xTick = v => x0 + (v - escalaX.lo) / (escalaX.hi - escalaX.lo) * (x1 - x0);
    const anchoX = Math.max(...etqX.map(e => e.length)) * GRAF_CARACTER + 12;
    const cadaX = Math.max(1, Math.ceil(anchoX / ((x1 - x0) / Math.max(1, escalaX.ticks.length - 1))));
    escalaX.ticks.forEach((v, k) => {
      const x = Math.round(xTick(v)) + .5;
      svgNodo("line", {x1: x, x2: x, y1: y0, y2: y1, class: "grid"}, ejes);
      if(!(k % cadaX)) rotular(etqX[k], xTick(v));
    });
  } else {
    const largo = Math.max(...g.categorias.map(c => recorte(c).length));
    const cada = Math.max(1, Math.ceil((largo * GRAF_CARACTER + 8) / hueco));
    g.categorias.forEach((c, i) => {
      if(!(i % cada)) rotular(recorte(c), xDe(i));
    });
  }

  const S = g.series.length;
  const capa = svgNodo("g", {}, svg);
  if(esBarras){
    const GAP = 2;
    const w = Math.max(1, Math.min(24, (banda * .8 - GAP * (S - 1)) / S));
    const yBase = yDe(0);
    g.valores.forEach((fila, i) => {
      const grupo = svgNodo("g", {class: "grupo", "data-i": i}, capa);
      const inicio = xDe(i) - (w * S + GAP * (S - 1)) / 2;
      fila.forEach((v, k) => {
        if(v === null || v === 0) return;
        svgNodo("path", {class: "barra s" + (k + 1), d: caminoBarra(inicio + k * (w + GAP), w, yBase, yDe(v))}, grupo);
      });
    });
  } else {

    if(esArea){
      const yBase = redondo(yDe(Math.min(Math.max(0, escala.lo), escala.hi)));
      g.series.forEach((nombre, k) => {
        let tramo = [];
        const cerrar = () => {

          if(tramo.length > 1){
            const d = "M" + tramo[0][0] + "," + yBase +
              tramo.map(p => "L" + p[0] + "," + p[1]).join("") +
              "L" + tramo[tramo.length - 1][0] + "," + yBase + "Z";
            svgNodo("path", {class: "area s" + (k + 1), d}, capa);
          }
          tramo = [];
        };
        g.valores.forEach((fila, i) => {
          if(fila[k] === null) cerrar();
          else tramo.push([redondo(xDe(i)), redondo(yDe(fila[k]))]);
        });
        cerrar();
      });
    }
    if(traza) g.series.forEach((nombre, k) => {
      let d = "", seguido = false;
      g.valores.forEach((fila, i) => {
        if(fila[k] === null){ seguido = false; return; }
        d += (seguido ? "L" : "M") + redondo(xDe(i)) + "," + redondo(yDe(fila[k]));
        seguido = true;
      });
      if(d) svgNodo("path", {class: "linea s" + (k + 1), d}, capa);
    });

    g.series.forEach((nombre, k) => {
      g.valores.forEach((fila, i) => {
        if(fila[k] === null) return;
        const suelto = (i === 0 || g.valores[i - 1][k] === null) && (i === n - 1 || g.valores[i + 1][k] === null);
        if(esDisp || n <= 24 || suelto){
          svgNodo("circle", {class: "punto s" + (k + 1), cx: redondo(xDe(i)), cy: redondo(yDe(fila[k])), r: 4}, capa);
        }
      });
    });
  }

  const cruz = !esBarras ? svgNodo("line", {class: "cruz", x1: 0, x2: 0, y1: y0, y2: y1}, svg) : null;
  const resaltes = !esBarras ? svgNodo("g", {}, svg) : null;
  const zonas = svgNodo("g", {}, svg);
  const orden = g.categorias.map((c, i) => i).sort((a, b) => xDe(a) - xDe(b));
  for(let p = 0; p < n; p++){
    const i = orden[p];
    const desde = esBarras ? x0 + banda * i
      : p === 0 ? x0 : (xDe(orden[p - 1]) + xDe(i)) / 2;
    const hasta = esBarras ? desde + banda
      : p === n - 1 ? x1 : (xDe(i) + xDe(orden[p + 1])) / 2;
    svgNodo("rect", {class: "zona", "data-i": i, x: redondo(desde), y: 0, width: redondo(Math.max(0, hasta - desde)), height: alto}, zonas);
  }

  const tip = crearTip(lienzo);

  const apagar = () => {
    tip.hidden = true;
    svg.classList.remove("hover");
    capa.querySelectorAll(".activo").forEach(e => e.classList.remove("activo"));
    if(cruz) cruz.classList.remove("ver");
    if(resaltes) resaltes.textContent = "";
  };

  const mostrar = (i, e) => {
    svg.classList.add("hover");
    if(esBarras){
      capa.querySelectorAll(".grupo").forEach(gr => gr.classList.toggle("activo", +gr.dataset.i === i));
    } else {
      const x = redondo(xDe(i));
      cruz.setAttribute("x1", x);
      cruz.setAttribute("x2", x);
      cruz.classList.add("ver");
      resaltes.textContent = "";
      g.valores[i].forEach((v, k) => {
        if(v !== null) svgNodo("circle", {class: "punto s" + (k + 1), cx: x, cy: redondo(yDe(v)), r: 5}, resaltes);
      });
    }

    tip.textContent = "";
    const cat = document.createElement("div");
    cat.className = "cat";
    cat.textContent = g.categorias[i];
    tip.appendChild(cat);
    g.series.forEach((nombre, k) => {
      const v = g.valores[i][k];
      const valor = fmtNumero(v) + (g.unidad && v !== null ? " " + g.unidad : "");
      tip.appendChild(filaTip("s" + (k + 1), valor, nombre));
    });
    tip.hidden = false;
    ubicarTip(tip, lienzo, e);
  };

  const alMover = e => {
    const zona = e.target.closest && e.target.closest(".zona");
    if(zona) mostrar(+zona.dataset.i, e); else apagar();
  };
  svg.addEventListener("pointermove", alMover);
  svg.addEventListener("pointerdown", alMover);

  svg.addEventListener("pointerleave", e => { if(e.pointerType !== "touch") apagar(); });
  lienzo._apagar = apagar;
}

function dibujarTorta(lienzo, g, ancho){
  const MARGEN = 58;
  const alto = GRAF_ALTO + 16;
  const cx = ancho / 2, cy = alto / 2;
  const r = Math.max(40, Math.min(GRAF_ALTO / 2, ancho / 2 - MARGEN));

  const svg = svgNodo("svg", {
    viewBox: "0 0 " + ancho + " " + alto, width: ancho, height: alto, role: "img",
    "aria-label": g.titulo || t("graficoTorta")
  }, lienzo);
  const capa = svgNodo("g", {}, svg);
  const etiquetas = svgNodo("g", {}, svg);
  const parte = i => (g.valores[i][0] || 0) / g.total;
  const pct = f => fmtNumero(f * 100, 1) + " %";

  let a = -Math.PI / 2;
  const ultima = {};
  g.categorias.forEach((c, i) => {
    const f = parte(i);
    if(!f) return;
    const a0 = a, a1 = a + f * Math.PI * 2;
    a = a1;
    svgNodo("path", {class: "porcion s" + (i + 1), "data-i": i, d: caminoPorcion(cx, cy, r, a0, a1)}, capa);

    if(f < .04) return;
    const med = (a0 + a1) / 2, lado = Math.cos(med) >= 0 ? 1 : -1;
    const y = cy + (r + 10) * Math.sin(med);
    if(ultima[lado] !== undefined && Math.abs(y - ultima[lado]) < 13) return;
    ultima[lado] = y;

    const txt = pct(f), w = txt.length * GRAF_CARACTER;
    const x = cx + (r + 10) * Math.cos(med);
    svgNodo("text", {
      x: redondo(lado > 0 ? Math.min(x, ancho - w) : Math.max(x, w)),
      y: redondo(y), dy: "0.32em", "text-anchor": lado > 0 ? "start" : "end"
    }, etiquetas).textContent = txt;
  });

  const tip = crearTip(lienzo);
  const apagar = () => {
    tip.hidden = true;
    svg.classList.remove("hover");
    capa.querySelectorAll(".activo").forEach(e => e.classList.remove("activo"));
  };

  const mostrar = (i, e) => {
    svg.classList.add("hover");
    capa.querySelectorAll(".porcion").forEach(p => p.classList.toggle("activo", +p.dataset.i === i));

    tip.textContent = "";
    const cat = document.createElement("div");
    cat.className = "cat";
    cat.textContent = g.categorias[i];
    tip.appendChild(cat);
    const v = g.valores[i][0];
    tip.appendChild(filaTip(
      "s" + (i + 1),
      fmtNumero(v) + (g.unidad && v !== null ? " " + g.unidad : ""),
      pct(parte(i))
    ));
    tip.hidden = false;
    ubicarTip(tip, lienzo, e);
  };

  const alMover = e => {
    const p = e.target.closest && e.target.closest(".porcion");
    if(p) mostrar(+p.dataset.i, e); else apagar();
  };
  svg.addEventListener("pointermove", alMover);
  svg.addEventListener("pointerdown", alMover);
  svg.addEventListener("pointerleave", e => { if(e.pointerType !== "touch") apagar(); });
  lienzo._apagar = apagar;
}

function armarGrafico(bloque){
  const fuente = bloque.querySelector(".chart-src");
  const g = leerGrafico(fuente.textContent);

  const caja = document.createElement("div");
  caja.className = "chart-dibujo";

  if(g.titulo){
    const titulo = document.createElement("p");
    titulo.className = "chart-titulo";
    titulo.textContent = g.titulo;
    caja.appendChild(titulo);
  }

  const rotulos = g.tipo === "torta" ? g.categorias : g.series.length > 1 ? g.series : [];
  if(rotulos.length){
    const leyenda = document.createElement("div");
    leyenda.className = "chart-leyenda " + g.tipo;
    rotulos.forEach((nombre, k) => {
      const item = document.createElement("span");
      const clave = document.createElement("i");
      clave.className = "s" + (k + 1);
      item.append(clave, document.createTextNode(nombre));
      leyenda.appendChild(item);
    });
    caja.appendChild(leyenda);
  }

  const lienzo = document.createElement("div");
  lienzo.className = "chart-lienzo";
  caja.appendChild(lienzo);

  const datos = document.createElement("details");
  datos.className = "chart-datos";
  const resumen = document.createElement("summary");
  resumen.textContent = t("verDatos");
  const envoltura = document.createElement("div");
  envoltura.className = "tablewrap";
  const tabla = document.createElement("table");
  const cabecera = tabla.createTHead().insertRow();
  [g.ejeX, ...g.series].forEach(t => {
    const th = document.createElement("th");
    th.textContent = t;
    cabecera.appendChild(th);
  });
  const cuerpo = tabla.createTBody();
  g.categorias.forEach((c, i) => {
    const fila = cuerpo.insertRow();
    fila.insertCell().textContent = c;
    g.valores[i].forEach(v => {
      const td = fila.insertCell();
      td.className = "num";
      td.textContent = fmtNumero(v);
    });
  });
  envoltura.appendChild(tabla);
  datos.append(resumen, envoltura);
  caja.appendChild(datos);

  bloque.appendChild(caja);
  fuente.hidden = true;
  bloque.dataset.chart = "listo";
  bloque._grafico = g;
  dibujarLienzo(lienzo, g);
  agregarBotonAmpliar(bloque);
}

function pintarGraficos(){
  $("doc").querySelectorAll('.chart[data-chart="pendiente"]').forEach(bloque => {
    try{
      armarGrafico(bloque);
    }catch(error){
      const armado = bloque.querySelector(".chart-dibujo");
      if(armado) armado.remove();
      const fuente = bloque.querySelector(".chart-src");
      if(fuente) fuente.hidden = false;
      bloque.dataset.chart = "error";
      const nota = document.createElement("p");
      nota.className = "diagram-err";
      nota.textContent = t("graficoError", String((error && error.message) || error || ""));
      bloque.appendChild(nota);
    }
  });
}

const ZOOM_MIN = 0.15, ZOOM_MAX = 8;
let zoomEsc = 1, zoomX = 0, zoomY = 0;
let zoomAncho = 0, zoomAlto = 0;
let zoomFijo = false;
let zoomVolverA = null;
const zoomPuntos = new Map();
let zoomPellizco = null;

function medidaSvg(svg){
  const vb = (svg.getAttribute("viewBox") || "").trim().split(/[\s,]+/).map(Number);
  if(vb.length === 4 && vb[2] > 0 && vb[3] > 0) return {ancho:vb[2], alto:vb[3]};
  const caja = svg.getBoundingClientRect();
  return {ancho:Math.round(caja.width) || 640, alto:Math.round(caja.height) || 420};
}

function aplicarZoom(){
  const caja = $("zoomLienzo").firstElementChild;
  if(!caja) return;
  caja.style.transform = "translate(" + Math.round(zoomX) + "px," + Math.round(zoomY) +
    "px) scale(" + zoomEsc.toFixed(4) + ")";
  $("zoomNivel").textContent = Math.round(zoomEsc * 100) + "%";
}

function escalaAjuste(){
  if(zoomFijo || !zoomAncho || !zoomAlto) return 1;
  const lienzo = $("zoomLienzo"), margen = 24;
  return Math.min((lienzo.clientWidth - margen) / zoomAncho,
                  (lienzo.clientHeight - margen) / zoomAlto, 3);
}

function ajustarZoom(esc){
  const lienzo = $("zoomLienzo");
  zoomEsc = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, esc || escalaAjuste()));
  zoomX = Math.max(0, (lienzo.clientWidth - zoomAncho * zoomEsc) / 2);
  zoomY = Math.max(0, (lienzo.clientHeight - zoomAlto * zoomEsc) / 2);
  aplicarZoom();
}

function escalarZoom(factor, px, py){
  const nuevo = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoomEsc * factor));
  if(nuevo === zoomEsc) return;
  zoomX = px - (px - zoomX) * (nuevo / zoomEsc);
  zoomY = py - (py - zoomY) * (nuevo / zoomEsc);
  zoomEsc = nuevo;
  aplicarZoom();
}

function escalarDesdeElCentro(factor){
  const lienzo = $("zoomLienzo");
  escalarZoom(factor, lienzo.clientWidth / 2, lienzo.clientHeight / 2);
}

function nombreZoom(bloque){
  const titulo = bloque.querySelector(".chart-titulo");
  if(titulo) return titulo.textContent;
  if(bloque._grafico) return t(NOMBRE_GRAFICO[bloque._grafico.tipo]);
  return t("zoomDiagrama");
}

function contenidoZoom(bloque){
  const lienzo = $("zoomLienzo");
  const caja = document.createElement("div");
  caja.className = "zoom-contenido";

  if(bloque.classList.contains("chart") && bloque._grafico){
    caja.classList.add("chart");
    ["chart-titulo", "chart-leyenda"].forEach(clase => {
      const parte = bloque.querySelector("." + clase);
      if(parte) caja.appendChild(parte.cloneNode(true));
    });
    const dibujo = document.createElement("div");
    dibujo.className = "chart-lienzo";
    caja.appendChild(dibujo);

    caja.style.width = Math.max(320, Math.min(lienzo.clientWidth - 24, 1400)) + "px";
    lienzo.appendChild(caja);
    dibujarLienzo(dibujo, bloque._grafico);
    zoomFijo = true;
    return caja;
  }

  const svg = bloque.querySelector(".diagram-svg svg");
  if(!svg) return null;
  const copia = svg.cloneNode(true);
  const medida = medidaSvg(svg);

  copia.style.maxWidth = "none";
  copia.style.width = medida.ancho + "px";
  copia.style.height = medida.alto + "px";
  caja.appendChild(copia);
  lienzo.appendChild(caja);
  zoomFijo = false;
  return caja;
}

function abrirZoom(bloque){
  const visor = $("zoom"), lienzo = $("zoomLienzo");
  lienzo.textContent = "";
  visor.hidden = false;
  const caja = contenidoZoom(bloque);
  if(!caja){ visor.hidden = true; return; }
  zoomAncho = caja.offsetWidth;
  zoomAlto = caja.offsetHeight;
  $("zoomNombre").textContent = nombreZoom(bloque);
  zoomVolverA = document.activeElement;

  ajustarZoom(Math.max(escalaAjuste(), 0.5));
  $("zoomCerrar").focus();
}

function cerrarZoom(){
  if($("zoom").hidden) return;
  $("zoom").hidden = true;
  $("zoomLienzo").textContent = "";
  zoomPuntos.clear();
  zoomPellizco = null;
  if(zoomVolverA && zoomVolverA.isConnected) zoomVolverA.focus();
  zoomVolverA = null;
}

function agregarBotonAmpliar(bloque){
  if(bloque.querySelector(":scope > .ampliar")) return;
  const boton = document.createElement("button");
  boton.type = "button";
  boton.className = "ampliar";
  boton.textContent = "⤢";
  boton.title = t("ampliar");
  boton.setAttribute("aria-label", t("ampliar"));
  boton.addEventListener("click", e => { e.stopPropagation(); abrirZoom(bloque); });
  bloque.appendChild(boton);
}

$("doc").addEventListener("click", e => {
  const bloque = e.target.closest('.diagram[data-diagram="listo"]');
  if(bloque && !e.target.closest(".ampliar") && !getSelection().toString()) abrirZoom(bloque);
});

(function armarVisor(){
  const lienzo = $("zoomLienzo");

  const pellizco = () => {
    const [a, b] = [...zoomPuntos.values()];
    return {x:(a.x + b.x) / 2, y:(a.y + b.y) / 2, dist:Math.hypot(a.x - b.x, a.y - b.y)};
  };

  lienzo.addEventListener("wheel", e => {
    e.preventDefault();
    const caja = lienzo.getBoundingClientRect();

    const paso = e.ctrlKey ? 0.01 : 0.0022;
    escalarZoom(Math.exp(-e.deltaY * paso), e.clientX - caja.left, e.clientY - caja.top);
  }, {passive:false});

  lienzo.addEventListener("pointerdown", e => {
    lienzo.setPointerCapture(e.pointerId);
    zoomPuntos.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(zoomPuntos.size === 2) zoomPellizco = pellizco();
    lienzo.classList.add("arrastrando");
  });

  lienzo.addEventListener("pointermove", e => {
    const previo = zoomPuntos.get(e.pointerId);
    if(!previo) return;
    zoomPuntos.set(e.pointerId, {x:e.clientX, y:e.clientY});

    if(zoomPuntos.size >= 2){
      const caja = lienzo.getBoundingClientRect();
      const ahora = pellizco();
      if(zoomPellizco && zoomPellizco.dist > 0 && ahora.dist > 0){

        escalarZoom(ahora.dist / zoomPellizco.dist,
                    zoomPellizco.x - caja.left, zoomPellizco.y - caja.top);
        zoomX += ahora.x - zoomPellizco.x;
        zoomY += ahora.y - zoomPellizco.y;
        aplicarZoom();
      }
      zoomPellizco = ahora;
      return;
    }

    zoomX += e.clientX - previo.x;
    zoomY += e.clientY - previo.y;
    aplicarZoom();
  });

  ["pointerup","pointercancel"].forEach(ev => lienzo.addEventListener(ev, e => {
    zoomPuntos.delete(e.pointerId);
    if(zoomPuntos.size < 2) zoomPellizco = null;
    if(!zoomPuntos.size) lienzo.classList.remove("arrastrando");
  }));

  lienzo.addEventListener("dblclick", e => {
    const caja = lienzo.getBoundingClientRect();
    if(Math.abs(zoomEsc - escalaAjuste()) > 0.01) ajustarZoom();
    else escalarZoom(2, e.clientX - caja.left, e.clientY - caja.top);
  });

  $("zoomMas").onclick = () => escalarDesdeElCentro(1.25);
  $("zoomMenos").onclick = () => escalarDesdeElCentro(0.8);
  $("zoomAjustar").onclick = () => ajustarZoom();
  $("zoomCerrar").onclick = cerrarZoom;
})();

function leerArchivoComoTexto(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve({
      name:file.name,
      path:file.webkitRelativePath || file.name,
      text:String(r.result ?? "")
    });
    r.onerror = () => reject(r.error || new Error("No se pudo leer " + file.name));
    r.readAsText(file, "utf-8");
  });
}

  const rutaActiva = current >= 0 && DOCS[current] ? DOCS[current].path : null;

  const leidos = resultados
    .filter(r => r.status === "fulfilled")
    .map(r => r.value);

  resultados
    .filter(r => r.status === "rejected")
    .forEach(r => console.error("No se pudo leer un archivo:", r.reason));

  if(!leidos.length){

    return;
  }

  leidos.forEach(doc => {
    const exists = DOCS.findIndex(d => d.path === doc.path);
    if(exists >= 0) DOCS[exists] = doc; else DOCS.push(doc);
  });

  afterLoad(rutaActiva);
  await guardarDocumentosPersistidos(leidos);
  await guardarEstadoPersistido();

  if(navigator.storage && navigator.storage.persist){
    navigator.storage.persist().catch(() => {});
  }
}

const GH_TOKEN_KEY = "lectormd-gh-token";

function parsearRepoGithub(entrada){
  const s = (entrada || "").trim();
  if(!s) return null;

  const limpio = s.replace(/^https?:\/\/(www\.)?github\.com\//i, "")
                  .replace(/\.git$/i, "")
                  .replace(/^\/+|\/+$/g, "");
  const m = limpio.match(/^([^/\s]+)\/([^/\s]+)(?:\/tree\/(.+))?$/);
  if(!m) return null;
  return {owner:m[1], repo:m[2], rama:m[3] ? decodeURIComponent(m[3]) : null};
}

class ErrorGithub extends Error{
  constructor(clave){ super(clave); this.claveTexto = clave; }
}

function sinCacheGithub(url){
  return url + (url.includes("?") ? "&" : "?") + "_=" + Date.now();
}

async function pedirGithub(url, token){
  const headers = {Accept:"application/vnd.github+json"};
  if(token) headers.Authorization = "Bearer " + token;
  let res;
  try{
    res = await fetch(sinCacheGithub(url), {headers, cache:"no-store"});
  }catch{
    throw new ErrorGithub("ghErrRed");
  }
  if(res.status === 401) throw new ErrorGithub("ghErrAuth");
  if(res.status === 403 && res.headers.get("x-ratelimit-remaining") === "0"){
    throw new ErrorGithub("ghErrLimite");
  }
  if(res.status === 404) throw new ErrorGithub("ghErrNoEncontrado");
  if(!res.ok) throw new ErrorGithub("ghErrGenerico");
  return res.json();
}

async function obtenerRamaPorDefecto(owner, repo, token){
  const info = await pedirGithub("https://api.github.com/repos/" + owner + "/" + repo, token);
  return info.default_branch;
}

async function obtenerArbolGithub(owner, repo, rama, token){
  const url = "https://api.github.com/repos/" + owner + "/" + repo +
    "/git/trees/" + encodeURIComponent(rama) + "?recursive=1";
  const data = await pedirGithub(url, token);
  const archivos = (data.tree || [])
    .filter(it => it.type === "blob" && /\.(md|markdown|txt)$/i.test(it.path));
  return {archivos, truncado: !!data.truncated};
}

function decodificarBase64Utf8(b64){
  const binario = atob(b64.replace(/\n/g, ""));
  const bytes = Uint8Array.from(binario, c => c.charCodeAt(0));
  return new TextDecoder("utf-8").decode(bytes);
}

async function obtenerContenidoGithub(owner, repo, rama, path, token){
  if(!token){

    const url = "https://raw.githubusercontent.com/" + owner + "/" + repo + "/" +
      encodeURIComponent(rama) + "/" + path.split("/").map(encodeURIComponent).join("/");
    let res;
    try{
      res = await fetch(sinCacheGithub(url), {cache:"no-store"});
    }catch{
      throw new ErrorGithub("ghErrRed");
    }
    if(!res.ok) throw new ErrorGithub("ghErrNoEncontrado");
    return res.text();
  }
  const url = "https://api.github.com/repos/" + owner + "/" + repo + "/contents/" +
    path.split("/").map(encodeURIComponent).join("/") + "?ref=" + encodeURIComponent(rama);
  const data = await pedirGithub(url, token);
  return decodificarBase64Utf8(data.content || "");
}

async function traerArchivosGithub(owner, repo, rama, token){
  const {archivos, truncado} = await obtenerArbolGithub(owner, repo, rama, token);
  const resultados = await Promise.allSettled(
    archivos.map(a => obtenerContenidoGithub(owner, repo, rama, a.path, token)
      .then(text => ({
        name: a.path.split("/").pop(),
        path: owner + "/" + repo + "/" + a.path,
        text
      })))
  );
  const leidos = resultados.filter(r => r.status === "fulfilled").map(r => r.value);
  resultados.filter(r => r.status === "rejected")
    .forEach(r => console.error("No se pudo leer un archivo de GitHub:", r.reason));
  return {leidos, truncado};
}

function registrarRepoGithub(owner, repo, rama){
  const prefijo = owner + "/" + repo;
  const existente = REPOS_GITHUB.find(r => r.prefijo === prefijo);
  if(existente) existente.rama = rama;
  else REPOS_GITHUB.push({owner, repo, rama, prefijo});
  $("ghActualizar").hidden = false;
}

async function importarDesdeGithub(){
  const repoInfo = parsearRepoGithub($("ghRepo").value);
  if(!repoInfo){ mostrarMensajeGithub(t("ghErrRepo")); return; }

  const token = $("ghToken").value.trim();
  const ramaEscrita = $("ghRama").value.trim();
  const submit = $("ghSubmit");

  submit.disabled = true;
  mostrarMensajeGithub(t("ghImportando"));

  try{
    const {owner, repo} = repoInfo;
    const rama = ramaEscrita || repoInfo.rama ||
      await obtenerRamaPorDefecto(owner, repo, token);

    const {leidos, truncado} = await traerArchivosGithub(owner, repo, rama, token);
    if(!leidos.length){ mostrarMensajeGithub(t("ghErrSinArchivos")); return; }

    if($("ghRecordar").checked) localStorage.setItem(GH_TOKEN_KEY, token);
    else localStorage.removeItem(GH_TOKEN_KEY);

    const rutaActiva = current >= 0 && DOCS[current] ? DOCS[current].path : null;
    leidos.forEach(doc => {
      const exists = DOCS.findIndex(d => d.path === doc.path);
      if(exists >= 0) DOCS[exists] = doc; else DOCS.push(doc);
    });

    registrarRepoGithub(owner, repo, rama);
    afterLoad(rutaActiva);
    await guardarDocumentosPersistidos(leidos);
    await guardarEstadoPersistido();
    if(navigator.storage && navigator.storage.persist){
      navigator.storage.persist().catch(() => {});
    }

    cerrarModalGithub();
    if(truncado) alert(t("ghErrTruncado"));
  }catch(error){
    mostrarMensajeGithub(error instanceof ErrorGithub ? t(error.claveTexto) : t("ghErrGenerico"));
  }finally{
    submit.disabled = false;
  }
}

async function actualizarGithub(){
  if(!REPOS_GITHUB.length) return;
  const boton = $("ghActualizar");
  const textoOriginal = boton.textContent;
  boton.disabled = true;
  boton.textContent = t("ghActualizando");

  const token = localStorage.getItem(GH_TOKEN_KEY) || "";
  const rutaActiva = current >= 0 && DOCS[current] ? DOCS[current].path : null;
  const leidosTotal = [];
  let huboError = false;

  for(const repoInfo of REPOS_GITHUB){
    try{
      const {leidos, truncado} = await traerArchivosGithub(
        repoInfo.owner, repoInfo.repo, repoInfo.rama, token
      );
      if(truncado) huboError = true;

      const prefijo = repoInfo.prefijo + "/";
      const rutasNuevas = new Set(leidos.map(d => d.path));
      for(let i = DOCS.length - 1; i >= 0; i--){
        if(DOCS[i].path.startsWith(prefijo) && !rutasNuevas.has(DOCS[i].path)){
          const [quitado] = DOCS.splice(i, 1);
          delete scrollPorRuta[quitado.path];
          void eliminarDocumentoPersistido(quitado.path);
        }
      }

      leidos.forEach(doc => {
        const exists = DOCS.findIndex(d => d.path === doc.path);
        if(exists >= 0) DOCS[exists] = doc; else DOCS.push(doc);
      });
      leidosTotal.push(...leidos);
    }catch(error){
      console.error("No se pudo actualizar " + repoInfo.prefijo + ":", error);
      huboError = true;
    }
  }

  afterLoad(rutaActiva);
  await guardarDocumentosPersistidos(leidosTotal);
  await guardarEstadoPersistido();

  boton.disabled = false;
  boton.textContent = textoOriginal;
  if(huboError) alert(t("ghErrActualizar"));
}

function afterLoad(rutaActiva = null){

  DOCS.sort((a,b)=>{
    const w = p => p.includes("/") ? 1 : 0;
    return w(a.path) - w(b.path) || a.path.localeCompare(b.path,"es");
  });

  const siguiente = rutaActiva
    ? DOCS.findIndex(d => d.path === rutaActiva)
    : -1;
  if(DOCS.length) open(siguiente >= 0 ? siguiente : 0);
}

function drawFiles(){

    const grp = parts.length > 1 ? parts.slice(0,-1).join(" / ") : t("raizCarpeta");
    if(grp !== lastGrp){ html += '<div class="grp">'+esc(grp)+"</div>"; lastGrp = grp; }
    html += '<div class="filerow'+(idx===current?" cur":"")+'">'
          +   '<button class="file" data-i="'+idx+'" aria-current="'+(idx===current)+
              '" title="'+esc(d.path)+'">'+esc(d.name)+'</button>'
          +   '<button class="rm" data-rm="'+idx+'" aria-label="'+esc(t("quitarAria", d.name))+
              '" title="'+esc(t("quitarTitle"))+'">&times;</button>'
          + '</div>';

  box.querySelectorAll(".rm").forEach(b => b.onclick = () => removeDoc(+b.dataset.rm));

  $("listHd").hidden = false;

function removeDoc(i){
  if(i < 0 || i >= DOCS.length) return;
  tomarPosicionActual();
  const [quitado] = DOCS.splice(i, 1);
  delete scrollPorRuta[quitado.path];

  if(!DOCS.length){ resetWorkspace(); return; }

  if(i === current){

    open(Math.min(i, DOCS.length - 1), {guardarAnterior:false});
  } else {
    if(i < current) current--;
    drawFiles();
    programarGuardadoEstado();
  }

  void eliminarDocumentoPersistido(quitado.path);
}

function open(i, opciones = {}){

  if(viendoAyuda) cerrarAyuda();

  const persistir = opciones.persistir !== false;
  if(guardarAnterior) tomarPosicionActual();

  current = i;
  const d = DOCS[i];
  const {html, heads} = render(d.text);
  mostrarDocumento(html);
  $("docname").textContent = d.path;

  document.title = d.name.replace(/\.(md|markdown|txt)$/i, "");
  $("search").disabled = false;
  $("search").value = "";
  $("hits").textContent = "";
  const posicion = Number(scrollPorRuta[d.path]);
  const posicionObjetivo = Number.isFinite(posicion) && posicion >= 0 ? posicion : 0;
  $("main").scrollTop = posicionObjetivo;
  requestAnimationFrame(() => {
    if(current >= 0 && DOCS[current] && DOCS[current].path === d.path){
      $("main").scrollTop = posicionObjetivo;
    }
  });

  dibujarIndice(heads);
  drawFiles();
  closeSide();
  if(persistir) programarGuardadoEstado();
}

function clearMarks(root){
  root.querySelectorAll("mark").forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
  root.normalize();
}
function search(q){
  const art = $("doc");
  clearMarks(art);
  if(!q || q.length < 2){ $("hits").textContent = ""; return; }
  const rx = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "gi");
  let n = 0, first = null;

  const walk = document.createTreeWalker(art, NodeFilter.SHOW_TEXT, {
    acceptNode: node => node.parentElement &&
      node.parentElement.closest("svg,[hidden],details:not([open]) > :not(summary)")
      ? NodeFilter.FILTER_REJECT
      : NodeFilter.FILTER_ACCEPT
  });
  const nodes = [];
  while(walk.nextNode()) nodes.push(walk.currentNode);
  nodes.forEach(node=>{
    if(!rx.test(node.nodeValue)) return;
    rx.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    while((m = rx.exec(node.nodeValue))){
      frag.appendChild(document.createTextNode(node.nodeValue.slice(last, m.index)));
      const mk = document.createElement("mark");
      mk.textContent = m[0];
      frag.appendChild(mk);
      if(!first) first = mk;
      n++; last = m.index + m[0].length;
      if(m[0].length === 0) rx.lastIndex++;
    }
    frag.appendChild(document.createTextNode(node.nodeValue.slice(last)));
    node.replaceWith(frag);
  });
  $("hits").textContent = t("resultados", n);
  if(first) $("main").scrollTo({top: first.offsetTop - 90, behavior:"smooth"});
}

$("sideExpand").onclick = () => setSidebarCollapsed(false);

let sidebarColapsada = false;
try{ sidebarColapsada = localStorage.getItem("lectormd-sidebar") === "1"; }catch(e){}
setSidebarCollapsed(sidebarColapsada);

$("theme").onclick = ()=>{
  const next = esTemaOscuro() ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("lectormd-theme", next); }catch(e){}
  redibujarDiagramas();
};
try{
  const t = localStorage.getItem("lectormd-theme");
  if(t) document.documentElement.setAttribute("data-theme", t);
}catch(e){}

matchMedia("(prefers-color-scheme:dark)").addEventListener("change", () => {
  if(!document.documentElement.getAttribute("data-theme")) redibujarDiagramas();
});

function cambiarIdioma(nuevo){
  IDIOMA = nuevo;
  try{ localStorage.setItem("lectormd-lang", nuevo); }catch(e){}
  traducirPagina();
  pintarEstados();
  setDensity(document.body.classList.contains("compact"));

  if(viendoAyuda) pintarAyuda();
  else if(current >= 0) open(current, {persistir:false});
  else limpiarVista();
  if(DOCS.length) drawFiles();
}
$("lang").onclick = () => cambiarIdioma(IDIOMA === "es" ? "en" : "es");

pintarEstados();
$("docname").textContent = t("ningunArchivo");

workspaceReady = restaurarWorkspace();

["dragenter","dragover"].forEach(ev =>
  document.addEventListener(ev, e => { e.preventDefault(); document.body.classList.add("dragging"); }));
["dragleave","drop"].forEach(ev =>
  document.addEventListener(ev, e => { e.preventDefault(); document.body.classList.remove("dragging"); }));
document.addEventListener("drop", e=>{
  const items = e.dataTransfer.files;
  if(items && items.length) void addFiles([...items]);
});

document.addEventListener("keydown", e=>{

  if(!$("zoom").hidden){
    if(e.key === "Escape"){ cerrarZoom(); return; }
    if(e.key === "+" || e.key === "="){ escalarDesdeElCentro(1.25); return; }
    if(e.key === "-"){ escalarDesdeElCentro(0.8); return; }
    if(e.key === "0"){ ajustarZoom(); return; }
    return;
  }
  if((e.ctrlKey||e.metaKey) && e.key === "f"){ e.preventDefault(); $("search").focus(); $("search").select(); }
  if(e.key === "Escape" && document.activeElement === $("search")){
    $("search").value = ""; search(""); $("search").blur();
  }
  if(e.target.tagName === "INPUT") return;
  if((e.key === "j" || e.key === "ArrowDown") && e.altKey && current < DOCS.length-1) open(current+1);
  if((e.key === "k" || e.key === "ArrowUp")   && e.altKey && current > 0) open(current-1);
});

(function loadKatex(){
  const BASE = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/" + KATEX_VER + "/";

  const css = document.createElement("link");
  css.rel = "stylesheet";
  css.href = BASE + "katex.min.css";
  document.head.appendChild(css);

  const js = document.createElement("script");
  js.src = BASE + "katex.min.js";

  js.onload = () => {
    KATEX = true;
    estadoKatex = "on";
    pintarEstados();
    if(current >= 0) open(current);
  };

  js.onerror = () => {
    estadoKatex = "off";
    pintarEstados();
  };

  document.head.appendChild(js);
})();

if("launchQueue" in window && "files" in LaunchParams.prototype){
  window.launchQueue.setConsumer(async (launchParams) => {
    if(!launchParams.files.length) return;
    const files = [];
    for(const handle of launchParams.files){
      try{
        const file = await handle.getFile();
        files.push(file);
      }catch(e){
        console.error("No se pudo leer el archivo entregado por el sistema:", e);
      }
    }
    if(files.length) await addFiles(files);
  });
}

async function cargarCompartidos(){
  try{
    const cache = await caches.open("lector-md-share");
    const keys  = await cache.keys();
    if(!keys.length) return;

    const archivos = [];
    for(const k of keys){
      const res = await cache.match(k);
      if(!res) continue;
      const nombre = decodeURIComponent(new URL(k.url).pathname.split("/").pop());
      const blob = await res.blob();
      archivos.push(new File([blob], nombre, {type:"text/markdown"}));
    }

    for(const k of keys) await cache.delete(k);

    if(archivos.length) await addFiles(archivos);
  }catch(e){
    console.error("No se pudieron leer los archivos compartidos:", e);
  }finally{

    history.replaceState(null, "", location.pathname);
  }
}

if(new URLSearchParams(location.search).has("compartido")){
  if(navigator.serviceWorker && navigator.serviceWorker.controller){
    cargarCompartidos();
  }else{

    navigator.serviceWorker
      ? navigator.serviceWorker.ready.then(cargarCompartidos)
      : null;
  }
}

let recargaSolicitada = false;
let recargandoPorActualizacion = false;

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").then(reg => {

      if(reg.waiting && navigator.serviceWorker.controller){
        avisarActualizacion(reg);
      }

      reg.addEventListener("updatefound", () => {
        const nuevo = reg.installing;
        if(!nuevo) return;
        nuevo.addEventListener("statechange", () => {

          if(nuevo.state === "installed" && navigator.serviceWorker.controller){
            avisarActualizacion(reg);
          }
        });
      });

      document.addEventListener("visibilitychange", () => {
        if(document.visibilityState === "visible") reg.update();
      });

    }).catch(e=>{
      console.error("No se pudo registrar el service worker:", e);
    });

    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if(!recargaSolicitada || recargandoPorActualizacion) return;
      recargandoPorActualizacion = true;
      location.reload();
    });
  });
}

function avisarActualizacion(reg){
  if(document.getElementById("updBar")) return;
  const bar = document.createElement("div");
  bar.id = "updBar";
  bar.innerHTML =
    '<span>' + t("updLista") + '</span>' +
    '<button type="button" id="updBtn">' + t("updBoton") + '</button>';
  document.body.appendChild(bar);
  document.getElementById("updBtn").onclick = async () => {
    const btn = document.getElementById("updBtn");
    const mensaje = bar.querySelector("span");
    btn.disabled = true;
    mensaje.textContent = t("updGuardando");

    const guardado = await guardarWorkspaceCompleto();
    if(!guardado && DOCS.length){
      mensaje.textContent = t("updFallo");
      btn.disabled = false;
      return;
    }

    const waiting = reg.waiting;
    if(!waiting){
      mensaje.textContent = t("updProxima");
      return;
    }

    recargaSolicitada = true;
    mensaje.textContent = t("updActualizando");
    waiting.postMessage("SKIP_WAITING");
  };
}
